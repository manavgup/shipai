  <text x="75" y="526" text-anchor="middle" font-size="8" fill="#94A3B8">6 transports</text>

  <rect x="135" y="500" width="100" height="34" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="185" y="514" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Telemetry</text>
  <text x="185" y="526" text-anchor="middle" font-size="8" fill="#94A3B8">3-layer pipeline</text>

  <rect x="665" y="500" width="100" height="34" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="715" y="514" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Team Sync</text>
  <text x="715" y="526" text-anchor="middle" font-size="8" fill="#94A3B8">SHA-256 delta</text>

  <rect x="775" y="500" width="95" height="34" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="822" y="514" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Sandbox</text>
  <text x="822" y="526" text-anchor="middle" font-size="8" fill="#94A3B8">macOS native</text>

  <!-- Footer stats -->
  <rect x="30" y="555" width="195" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="127" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#3B82F6">1,902</text>
  <text x="127" y="593" text-anchor="middle" font-size="10" fill="#94A3B8">Source Files</text>

  <rect x="245" y="555" width="145" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="317" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#8B5CF6">43</text>
  <text x="317" y="593" text-anchor="middle" font-size="10" fill="#94A3B8">Built-in Tools</text>

  <rect x="410" y="555" width="145" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="482" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#10B981">84</text>
  <text x="482" y="593" text-anchor="middle" font-size="10" fill="#94A3B8">Slash Commands</text>

  <rect x="575" y="555" width="145" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="647" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#F59E0B">170+</text>
  <text x="647" y="593" text-anchor="middle" font-size="10" fill="#94A3B8">Env Variables</text>

  <rect x="740" y="555" width="130" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="805" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#EF4444">26</text>
  <text x="805" y="593" text-anchor="middle" font-size="10" fill="#94A3B8">Feature Flags</text>
