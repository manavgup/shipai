  <rect x="200" y="182" width="130" height="56" rx="8" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="265" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="white">Query Loop</text>
  <text x="265" y="220" text-anchor="middle" font-size="9" fill="#DBEAFE">query.ts · 1,729 lines</text>

