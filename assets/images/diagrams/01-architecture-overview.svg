  <rect x="200" y="252" width="130" height="56" rx="8" fill="url(#green)" filter="url(#shadow)"/>
  <text x="265" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="white">State</text>
  <text x="265" y="290" text-anchor="middle" font-size="9" fill="#D1FAE5">Zustand + Bootstrap</text>

