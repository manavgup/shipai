  <text x="342" y="428" text-anchor="middle" font-size="11" font-weight="600" fill="#D97706">AWS Bedrock</text>
  <text x="342" y="443" text-anchor="middle" font-size="9" fill="#FBBF24">IAM · STS · VPC</text>

  <rect x="450" y="408" width="185" height="44" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="542" y="428" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">Google Vertex</text>
  <text x="542" y="443" text-anchor="middle" font-size="9" fill="#34D399">GoogleAuth · GCP</text>

  <rect x="650" y="408" width="185" height="44" rx="6" fill="#FDF4FF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="742" y="428" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">Azure Foundry</text>
  <text x="742" y="443" text-anchor="middle" font-size="9" fill="#A78BFA">Azure AD · Managed ID</text>

  <!-- Arrow down -->
  <path d="M450 468 L450 488" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

