  <rect x="30" y="75" width="840" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
  <text x="450" y="97" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">USER INPUT</text>
  <text x="120" y="113" text-anchor="middle" font-size="10" fill="#94A3B8">CLI Terminal</text>
  <text x="300" y="113" text-anchor="middle" font-size="10" fill="#94A3B8">VS Code Extension</text>
  <text x="480" y="113" text-anchor="middle" font-size="10" fill="#94A3B8">JetBrains Plugin</text>
  <text x="640" y="113" text-anchor="middle" font-size="10" fill="#94A3B8">Desktop App</text>
  <text x="790" y="113" text-anchor="middle" font-size="10" fill="#94A3B8">claude.ai/code</text>

