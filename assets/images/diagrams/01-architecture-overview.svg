  <defs><marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#94A3B8"/></marker></defs>

  <!-- Core System -->
  <rect x="30" y="148" width="840" height="200" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="170" font-size="12" font-weight="700" fill="#1E293B">CORE SYSTEM</text>

  <!-- main.tsx -->
  <rect x="50" y="182" width="130" height="56" rx="8" fill="url(#red)" filter="url(#shadow)"/>
  <text x="115" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="white">main.tsx</text>
  <text x="115" y="220" text-anchor="middle" font-size="9" fill="#FEE2E2">4,684 lines · entry</text>

