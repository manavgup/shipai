  <text x="715" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="white">Memory</text>
  <text x="715" y="220" text-anchor="middle" font-size="9" fill="#CFFAFE">MEMORY.md + topics</text>

  <!-- Second row -->
  <!-- Ink UI -->
