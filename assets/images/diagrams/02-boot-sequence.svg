<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FDF8F4"/><stop offset="100%" stop-color="#F5EDE6"/></linearGradient>
    <filter id="sh2"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#94A3B8"/></marker>
  </defs>
  <rect width="900" height="420" fill="url(#bg2)" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">Boot Sequence — 3-Phase Pipeline (~200ms)</text>

  <!-- Timeline line -->
  <line x1="80" y1="70" x2="80" y2="390" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Phase 1 -->
  <circle cx="80" cy="90" r="12" fill="#3B82F6"/>
  <text x="80" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="white">1</text>
  <rect x="110" y="72" width="760" height="70" rx="8" fill="white" stroke="#BFDBFE" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="130" y="92" font-size="13" font-weight="700" fill="#2563EB">Phase 1 — CLI Fast-Path</text>
  <text x="330" y="92" font-size="11" fill="#94A3B8">&lt;50ms</text>
  <text x="130" y="110" font-size="11" fill="#475569">cli.tsx loads → --version exits immediately. --daemon-worker, --chrome-native-host route to handlers.</text>
  <text x="130" y="126" font-size="11" fill="#475569">Bun feature() eliminates dead code at compile time. 26 flags strip ANT-only code from external builds.</text>
  <!-- time bar -->
  <rect x="700" y="82" width="60" height="18" rx="4" fill="#DBEAFE"/>
  <text x="730" y="95" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">&lt;50ms</text>

  <!-- Phase 2 -->
  <circle cx="80" cy="180" r="12" fill="#F59E0B"/>
  <text x="80" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="white">2</text>
  <rect x="110" y="156" width="760" height="100" rx="8" fill="white" stroke="#FED7AA" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="130" y="178" font-size="13" font-weight="700" fill="#D97706">Phase 2 — Parallel Initialization</text>
  <text x="380" y="178" font-size="11" fill="#94A3B8">~200ms (I/O overlapped)</text>
  <!-- Parallel bars -->
  <rect x="130" y="190" width="300" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="140" y="204" font-size="9" font-weight="600" fill="#92400E">MDM prefetch (plutil/reg) ~135ms</text>
  <rect x="130" y="215" width="180" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="140" y="229" font-size="9" font-weight="600" fill="#92400E">Keychain read ~65ms</text>
  <rect x="450" y="190" width="310" height="20" rx="4" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1"/>
  <text x="460" y="204" font-size="9" font-weight="600" fill="#5B21B6">187 module imports resolving</text>
  <rect x="450" y="215" width="200" height="20" rx="4" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
  <text x="460" y="229" font-size="9" font-weight="600" fill="#1E40AF">Auth validated (OAuth/API key)</text>
  <rect x="130" y="240" width="630" height="8" rx="4" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="455" y="248" text-anchor="middle" font-size="8" font-weight="600" fill="#065F46">Config cascade: Policy → User → Project → Local → CLI + 100+ tengu_* gates</text>
  <!-- time bar -->
  <rect x="700" y="165" width="60" height="18" rx="4" fill="#FEF3C7"/>
  <text x="730" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#D97706">~200ms</text>

  <!-- Phase 3 -->
  <circle cx="80" cy="300" r="12" fill="#10B981"/>
  <text x="80" y="304" text-anchor="middle" font-size="10" font-weight="700" fill="white">3</text>
  <rect x="110" y="276" width="760" height="95" rx="8" fill="white" stroke="#BBF7D0" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="130" y="298" font-size="13" font-weight="700" fill="#059669">Phase 3 — REPL Setup</text>
  <!-- Steps as pills -->
  <rect x="130" y="308" width="85" height="24" rx="12" fill="#D1FAE5"/>
  <text x="172" y="324" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">setCwd()</text>
  <path d="M218 320 L230 320" stroke="#94A3B8" stroke-width="1" marker-end="url(#arr2)"/>
  <rect x="233" y="308" width="65" height="24" rx="12" fill="#D1FAE5"/>
  <text x="265" y="324" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">Hooks</text>
  <path d="M301 320 L313 320" stroke="#94A3B8" stroke-width="1" marker-end="url(#arr2)"/>
  <rect x="316" y="308" width="80" height="24" rx="12" fill="#D1FAE5"/>
  <text x="356" y="324" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">43 Tools</text>
  <path d="M399 320 L411 320" stroke="#94A3B8" stroke-width="1" marker-end="url(#arr2)"/>
  <rect x="414" y="308" width="100" height="24" rx="12" fill="#D1FAE5"/>
  <text x="464" y="324" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">MCP (parallel)</text>
  <path d="M517 320 L529 320" stroke="#94A3B8" stroke-width="1" marker-end="url(#arr2)"/>
  <rect x="532" y="308" width="120" height="24" rx="12" fill="#D1FAE5"/>
  <text x="592" y="324" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">System Prompt</text>
  <path d="M655 320 L667 320" stroke="#94A3B8" stroke-width="1" marker-end="url(#arr2)"/>
  <rect x="670" y="308" width="100" height="24" rx="12" fill="#10B981"/>
  <text x="720" y="324" text-anchor="middle" font-size="9" font-weight="700" fill="white">Ink Render</text>

  <text x="130" y="354" font-size="11" fill="#475569">System prompt from 10+ sources: role, tool schemas, CLAUDE.md, MEMORY.md, memories, git context, OS info,</text>
  <text x="130" y="368" font-size="11" fill="#475569">MCP instructions, hooks docs, tips. Double-buffered terminal. Background tasks started. Idle.</text>

  <!-- Bottom label -->
  <rect x="300" y="388" width="300" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="450" y="405" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Ready for input — total ~200ms cold start</text>
</svg>