<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FDF8F4"/><stop offset="100%" stop-color="#F5EDE6"/></linearGradient>
    <filter id="sh3"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#64748B"/></marker>
    <marker id="arr3b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3B82F6"/></marker>
  </defs>
  <rect width="900" height="580" fill="url(#bg3)" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">The Query Loop — Core Cycle</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#94A3B8">query.ts · 1,729 lines · async generator · for await consumption</text>

  <!-- Step 1 -->
  <rect x="50" y="70" width="250" height="60" rx="10" fill="#3B82F6" filter="url(#sh3)"/>
  <circle cx="72" cy="100" r="14" fill="white" fill-opacity="0.2"/>
  <text x="72" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="white">1</text>
  <text x="94" y="95" font-size="12" font-weight="600" fill="white">User Message</text>
  <text x="94" y="112" font-size="9" fill="#DBEAFE">createUserMessage() + attachments</text>

  <path d="M300 100 L340 100" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Step 2 -->
  <rect x="345" y="70" width="250" height="60" rx="10" fill="#06B6D4" filter="url(#sh3)"/>
  <circle cx="367" cy="100" r="14" fill="white" fill-opacity="0.2"/>
  <text x="367" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="white">2</text>
  <text x="389" y="95" font-size="12" font-weight="600" fill="white">Compaction Check</text>
  <text x="389" y="112" font-size="9" fill="#CFFAFE">4 strategies · threshold 167K</text>

  <path d="M595 100 L635 100" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Step 3 -->
  <rect x="640" y="70" width="230" height="60" rx="10" fill="#8B5CF6" filter="url(#sh3)"/>
  <circle cx="662" cy="100" r="14" fill="white" fill-opacity="0.2"/>
  <text x="662" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="white">3</text>
  <text x="684" y="95" font-size="12" font-weight="600" fill="white">System Prompt</text>
  <text x="684" y="112" font-size="9" fill="#EDE9FE">10+ sources · cache_control</text>

  <!-- Arrow down -->
  <path d="M755 130 L755 158" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Step 4 - API Call (wide) -->
  <rect x="200" y="162" width="670" height="65" rx="10" fill="white" stroke="#3B82F6" stroke-width="2" filter="url(#sh3)"/>
  <circle cx="222" cy="194" r="14" fill="#3B82F6"/>
  <text x="222" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="white">4</text>
  <text x="245" y="187" font-size="13" font-weight="700" fill="#1E293B">Stream to Claude API via SSE</text>
  <text x="245" y="205" font-size="10" fill="#64748B">Tokens parsed incrementally, rendered to terminal in real-time. Fallback on 529: switch model after 3 retries.</text>
  <!-- Streaming visualization -->
  <rect x="245" y="212" width="500" height="8" rx="4" fill="#EFF6FF"/>
  <rect x="245" y="212" width="340" height="8" rx="4" fill="#3B82F6" opacity="0.6">
    <animate attributeName="width" from="0" to="500" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="760" y="220" font-size="8" fill="#94A3B8">streaming →</text>

  <!-- Arrow down -->
  <path d="M535 227 L535 248" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Step 5 - Tool Execution (highlight) -->
  <rect x="100" y="252" width="700" height="100" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2" filter="url(#sh3)"/>
  <circle cx="122" cy="280" r="14" fill="#F59E0B"/>
  <text x="122" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="white">5</text>
  <text x="145" y="276" font-size="13" font-weight="700" fill="#92400E">Tool Execution — Starts BEFORE Stream Ends</text>
  <text x="145" y="294" font-size="10" fill="#78716C">StreamingToolExecutor queues tool_use blocks as they arrive in the SSE stream</text>

  <!-- Parallel vs Sequential -->
  <rect x="120" y="306" width="310" height="34" rx="6" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="130" y="322" font-size="10" font-weight="600" fill="#065F46">Concurrent-safe (max 10 parallel)</text>
  <text x="130" y="335" font-size="9" fill="#059669">Read, Glob, Grep, WebFetch, WebSearch, ToolSearch</text>

  <rect x="445" y="306" width="340" height="34" rx="6" fill="#FEE2E2" stroke="#FECACA" stroke-width="1"/>
  <text x="455" y="322" font-size="10" font-weight="600" fill="#991B1B">Exclusive (sequential)</text>
  <text x="455" y="335" font-size="9" fill="#DC2626">Bash, FileEdit, FileWrite, Agent, NotebookEdit</text>

  <!-- Arrow down -->
  <path d="M450 352 L450 373" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Step 6 - Decision -->
  <polygon points="450,377 590,420 450,463 310,420" fill="white" stroke="#8B5CF6" stroke-width="2" filter="url(#sh3)"/>
  <circle cx="450" cy="410" r="14" fill="#8B5CF6"/>
  <text x="450" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="white">6</text>
  <text x="450" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">Continue?</text>

  <!-- Loop back arrow -->
  <path d="M310 420 L80 420 L80 100 L50 100" stroke="#3B82F6" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arr3b)"/>
  <text x="65" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#3B82F6" transform="rotate(-90,65,265)">tool_use → LOOP</text>

  <!-- End turn -->
  <path d="M590 420 L660 420" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="665" y="403" width="200" height="34" rx="8" fill="#10B981" filter="url(#sh3)"/>
  <text x="765" y="424" text-anchor="middle" font-size="11" font-weight="600" fill="white">end_turn → Return to REPL</text>

  <!-- Post-sampling hooks -->
  <rect x="100" y="480" width="700" height="85" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#sh3)"/>
  <text x="120" y="502" font-size="12" font-weight="700" fill="#475569">Post-Sampling Hooks (after final response)</text>
  <rect x="120" y="512" width="150" height="24" rx="12" fill="#DBEAFE"/>
  <text x="195" y="528" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">Auto-compact check</text>
  <rect x="280" y="512" width="170" height="24" rx="12" fill="#CFFAFE"/>
  <text x="365" y="528" text-anchor="middle" font-size="9" font-weight="600" fill="#0E7490">Memory extraction</text>
  <rect x="460" y="512" width="150" height="24" rx="12" fill="#EDE9FE"/>
  <text x="535" y="528" text-anchor="middle" font-size="9" font-weight="600" fill="#5B21B6">Speculation</text>
  <rect x="620" y="512" width="155" height="24" rx="12" fill="#FEF3C7"/>
  <text x="697" y="528" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">autoDream (24h+5)</text>
  <text x="120" y="554" font-size="9" fill="#94A3B8">Memory extraction runs every turn (forked agent). Speculation pre-computes next turn (ANT-only). autoDream consolidates after 24h + 5 sessions.</text>
</svg>