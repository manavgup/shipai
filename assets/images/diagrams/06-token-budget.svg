<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FDF8F4"/><stop offset="100%" stop-color="#F5EDE6"/></linearGradient>
    <filter id="sh6"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="900" height="300" fill="url(#bg6)" rx="12"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">Context Window — Token Budget (200K Model)</text>

  <!-- Main bar -->
  <rect x="50" y="55" width="800" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>

  <!-- System prompt 5-15K (7.5%) -->
  <rect x="50" y="55" width="60" height="60" rx="8" fill="#3B82F6"/>
  <rect x="102" y="55" width="0" height="60" fill="#3B82F6"/>
  <text x="80" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="white">System</text>
  <text x="80" y="96" text-anchor="middle" font-size="8" fill="#BFDBFE">5-15K</text>

  <!-- Memory 2-10K (5%) -->
  <rect x="110" y="55" width="40" height="60" fill="#06B6D4"/>
  <text x="130" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="white">Mem</text>
  <text x="130" y="96" text-anchor="middle" font-size="8" fill="#CFFAFE">2-10K</text>

  <!-- Conversation (grows) 40% -->
  <rect x="150" y="55" width="280" height="60" fill="#10B981"/>
  <text x="290" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="white">Conversation (grows)</text>
  <text x="290" y="96" text-anchor="middle" font-size="9" fill="#D1FAE5">User + Assistant messages</text>

  <!-- Tool results (grows) 25% -->
  <rect x="430" y="55" width="220" height="60" fill="#F59E0B"/>
  <text x="540" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="white">Tool Results (grows)</text>
  <text x="540" y="96" text-anchor="middle" font-size="9" fill="#FEF3C7">File reads, bash output, grep</text>

  <!-- Reserved for summary 20K (10%) -->
  <rect x="650" y="55" width="80" height="60" fill="#8B5CF6"/>
  <text x="690" y="78" text-anchor="middle" font-size="9" font-weight="600" fill="white">Reserved</text>
  <text x="690" y="92" text-anchor="middle" font-size="8" fill="#EDE9FE">20K</text>
  <text x="690" y="104" text-anchor="middle" font-size="7" fill="#EDE9FE">summary</text>

  <!-- Buffer 13K -->
  <rect x="730" y="55" width="52" height="60" fill="#94A3B8"/>
  <text x="756" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="white">Buffer</text>
  <text x="756" y="96" text-anchor="middle" font-size="8" fill="#E2E8F0">13K</text>

  <!-- Unused -->
  <rect x="782" y="55" width="68" height="60" rx="0" fill="#E2E8F0"/>
  <rect x="782" y="55" width="68" height="60" rx="0" fill="#E2E8F0"/>
  <!-- Right rounded corner -->
  <text x="816" y="88" text-anchor="middle" font-size="9" fill="#94A3B8">free</text>

  <!-- Threshold line -->
  <line x1="730" y1="45" x2="730" y2="125" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="730" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#EF4444">167K — Autocompact trigger</text>

  <!-- Scale -->
  <text x="50" y="152" font-size="9" fill="#94A3B8">0</text>
  <text x="250" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">50K</text>
  <text x="450" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">100K</text>
  <text x="650" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">150K</text>
  <text x="840" y="152" text-anchor="end" font-size="9" fill="#94A3B8">200K</text>
  <line x1="50" y1="140" x2="850" y2="140" stroke="#CBD5E1" stroke-width="0.5"/>

  <!-- Math -->
  <rect x="50" y="170" width="800" height="58" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1" filter="url(#sh6)"/>
  <text x="70" y="192" font-size="12" font-weight="700" fill="#1E293B">Threshold Math</text>
  <text x="70" y="210" font-size="11" fill="#475569" font-family="'Courier New',monospace">effectiveWindow = 200,000 - 20,000 (reserved) = 180,000</text>
  <text x="70" y="222" font-size="11" fill="#475569" font-family="'Courier New',monospace">autocompactThreshold = 180,000 - 13,000 (buffer) = <tspan font-weight="700" fill="#EF4444">167,000</tspan></text>

  <!-- 4 strategies -->
  <text x="450" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">4 Compaction Strategies</text>
  <rect x="50" y="262" width="185" height="30" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="142" y="281" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">1. Snip (drop old)</text>

  <rect x="250" y="262" width="185" height="30" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="342" y="281" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">2. Microcompact</text>

  <rect x="450" y="262" width="185" height="30" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
  <text x="542" y="281" text-anchor="middle" font-size="10" font-weight="600" fill="#5B21B6">3. Autocompact</text>

  <rect x="650" y="262" width="200" height="30" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="750" y="281" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">4. Context Collapse</text>
</svg>