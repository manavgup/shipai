<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="400" fill="#faf8f5"/>
  <text x="340" y="35" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="18" font-weight="600" fill="#1a1a2e">Enterprise AI Adoption Maturity</text>
  
  <!-- Main visualization area -->
  <rect x="60" y="70" width="560" height="280" fill="#1a1a2e" rx="8"/>
  
  <!-- 92% section -->
  <rect x="80" y="90" width="400" height="240" fill="#dbeafe" rx="6"/>
  <text x="280" y="180" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="72" font-weight="700" fill="#1a1a2e">92%</text>
  <text x="280" y="220" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" fill="#1a1a2e">Still experimenting or</text>
  <text x="280" y="240" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" fill="#1a1a2e">partially deployed</text>
  <text x="280" y="280" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" opacity="0.7">Pilots • POCs • "Exploring AI"</text>
  
  <!-- 8% section -->
  <rect x="500" y="90" width="100" height="240" fill="#1e40af" rx="6"/>
  <text x="550" y="200" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="36" font-weight="700" fill="#faf8f5">8%</text>
  <text x="550" y="235" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" fill="#faf8f5">Mature</text>
  <text x="550" y="252" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" fill="#faf8f5">adoption</text>
  
  <!-- Divider annotation -->
  <line x1="490" y1="100" x2="490" y2="320" stroke="#faf8f5" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Source -->
  <text x="340" y="380" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="10" fill="#1a1a2e" opacity="0.6">Source: Enterprise AI adoption research, 2024</text>
</svg>