<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 700; fill: #1a1a2e; }
    .label { font-family: 'DM Sans', sans-serif; font-size: 12px; fill: #1a1a2e; }
    .percent { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; fill: #1e40af; }
    .axis { font-family: 'DM Sans', sans-serif; font-size: 11px; fill: #666; }
  </style>
  
  <rect width="680" height="400" fill="#faf8f5"/>
  
  <text x="40" y="35" class="title">AI Job Intensity by Industry Sector</text>
  <text x="40" y="55" class="axis">Percentage of job postings that are AI-related</text>
  
  <g transform="translate(40, 80)">
    <!-- Information -->
    <text x="0" y="15" class="label">Information</text>
    <rect x="200" y="0" width="380" height="28" fill="#dbeafe" rx="4"/>
    <rect x="200" y="0" width="342" height="28" fill="#1e40af" rx="4"/>
    <text x="552" y="19" class="percent">90%</text>
    
    <!-- Professional/Scientific -->
    <text x="0" y="60" class="label">Professional &amp; Technical</text>
    <rect x="200" y="45" width="380" height="28" fill="#dbeafe" rx="4"/>
    <rect x="200" y="45" width="334" height="28" fill="#1e40af" rx="4"/>
    <text x="544" y="64" class="percent">88%</text>
    
    <!-- Finance -->
    <text x="0" y="105" class="label">Finance &amp; Insurance</text>
    <rect x="200" y="90" width="380" height="28" fill="#dbeafe" rx="4"/>
    <rect x="200" y="90" width="319" height="28" fill="#1e40af" rx="4"/>
    <text x="529" y="109" class="percent">84%</text>
    
    <!-- Manufacturing -->
    <text x="0" y="150" class="label">Manufacturing</text>
    <rect x="200" y="135" width="380" height="28" fill="#dbeafe" rx="4"/>
    <rect x="200" y="135" width="285" height="28" fill="#1e40af" rx="4"/>
    <text x="495" y="154" class="percent">75%</text>
    
    <!-- Retail -->
    <text x="0" y="195" class="label">Retail Trade</text>
    <rect x="200" y="180" width="380" height="28" fill="#dbeafe" rx="4"/>
    <rect x="200" y="180" width="247" height="28" fill="#1e40af" rx="4"/>
    <text x="457" y="199" class="percent">65%</text>
    
    <!-- Real Estate -->
    <text x="0" y="240" class="label">Real Estate</text>
    <rect x="200" y="225" width="380" height="28" fill="#dbeafe" rx="4"/>
    <rect x="200" y="225" width="152" height="28" fill="#1e40af" rx="4"/>
    <text x="362" y="244" class="percent">40%</text>
    
    <!-- Food Services -->
    <text x="0" y="285" class="label">Accommodation &amp; Food</text>
    <rect x="200" y="270" width="380" height="28" fill="#dbeafe" rx="4"/>
    <rect x="200" y="270" width="95" height="28" fill="#1e40af" rx="4"/>
    <text x="305" y="289" class="percent">25%</text>
  </g>
  
  <text x="340" y="385" class="axis" text-anchor="middle">Source: US Census Bureau / University of Maryland Analysis</text>
</svg>