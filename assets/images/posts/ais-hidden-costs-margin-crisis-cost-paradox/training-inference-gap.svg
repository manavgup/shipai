<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="400" fill="#faf8f5"/>
  
  <!-- Title -->
  <text x="340" y="35" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#1a1a2e" text-anchor="middle">The Training vs. Inference Imbalance</text>
  <text x="340" y="55" font-family="DM Sans, sans-serif" font-size="12" fill="#666" text-anchor="middle">For every $1 spent on inference, $2.25 goes to training</text>
  
  <!-- Training bar -->
  <rect x="120" y="100" width="360" height="80" fill="#1e40af" rx="4"/>
  <text x="300" y="145" font-family="DM Sans, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">TRAINING</text>
  <text x="300" y="165" font-family="DM Sans, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">One-time cost • 69% of compute spend</text>
  
  <!-- Inference bar -->
  <rect x="120" y="200" width="160" height="80" fill="#dbeafe" rx="4" stroke="#1e40af" stroke-width="2"/>
  <text x="200" y="245" font-family="DM Sans, sans-serif" font-size="16" font-weight="600" fill="#1a1a2e" text-anchor="middle">INFERENCE</text>
  <text x="200" y="265" font-family="DM Sans, sans-serif" font-size="12" fill="#1a1a2e" text-anchor="middle">Scales with revenue • 31%</text>
  
  <!-- Arrow and label -->
  <path d="M500 140 L560 140 L560 240 L500 240" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="580" y="185" font-family="DM Sans, sans-serif" font-size="13" fill="#1a1a2e" text-anchor="start">2.25x</text>
  <text x="580" y="200" font-family="DM Sans, sans-serif" font-size="11" fill="#666" text-anchor="start">ratio</text>
  
  <!-- Bottom insight -->
  <rect x="120" y="320" width="440" height="55" fill="#1a1a2e" rx="6"/>
  <text x="340" y="345" font-family="DM Sans, sans-serif" font-size="13" fill="#faf8f5" text-anchor="middle">For AI to become sustainable, this ratio must flip.</text>
  <text x="340" y="362" font-family="DM Sans, sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle">Inference revenue needs to exceed training costs—it doesn't yet.</text>
</svg>