<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="400" fill="#faf8f5"/>
  
  <!-- Title -->
  <text x="340" y="35" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#1a1a2e" text-anchor="middle">Days to 1 Million Users</text>
  
  <!-- Grid lines -->
  <line x1="120" y1="320" x2="620" y2="320" stroke="#dbeafe" stroke-width="1"/>
  <line x1="120" y1="260" x2="620" y2="260" stroke="#dbeafe" stroke-width="1" stroke-dasharray="4"/>
  <line x1="120" y1="200" x2="620" y2="200" stroke="#dbeafe" stroke-width="1" stroke-dasharray="4"/>
  <line x1="120" y1="140" x2="620" y2="140" stroke="#dbeafe" stroke-width="1" stroke-dasharray="4"/>
  <line x1="120" y1="80" x2="620" y2="80" stroke="#dbeafe" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Y-axis labels -->
  <text x="110" y="324" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="end">0</text>
  <text x="110" y="264" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="end">625</text>
  <text x="110" y="204" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="end">1,250</text>
  <text x="110" y="144" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="end">1,875</text>
  <text x="110" y="84" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="end">2,500</text>
  
  <!-- Bars (scaled: 2500 days = 240px height, baseline at y=320) -->
  <!-- Model T: 2500 days = 240px -->
  <rect x="150" y="80" width="80" height="240" fill="url(#barGrad)" rx="4"/>
  <text x="190" y="70" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#1a1a2e" text-anchor="middle">2,500</text>
  <text x="190" y="345" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="middle">Model T</text>
  <text x="190" y="360" font-family="DM Sans, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle" opacity="0.7">1908</text>
  
  <!-- TiVo: 1680 days = 161px -->
  <rect x="270" y="159" width="80" height="161" fill="url(#barGrad)" rx="4"/>
  <text x="310" y="149" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#1a1a2e" text-anchor="middle">1,680</text>
  <text x="310" y="345" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="middle">TiVo</text>
  <text x="310" y="360" font-family="DM Sans, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle" opacity="0.7">1999</text>
  
  <!-- iPhone: 74 days = 7px (minimum visible) -->
  <rect x="390" y="313" width="80" height="7" fill="url(#barGrad)" rx="2"/>
  <text x="430" y="303" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#1a1a2e" text-anchor="middle">74</text>
  <text x="430" y="345" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="middle">iPhone</text>
  <text x="430" y="360" font-family="DM Sans, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle" opacity="0.7">2007</text>
  
  <!-- ChatGPT: 5 days = barely visible, use minimum -->
  <rect x="510" y="319" width="80" height="1" fill="#1e40af" rx="0.5"/>
  <circle cx="550" cy="319" r="6" fill="#1e40af"/>
  <text x="550" y="303" font-family="DM Sans, sans-serif" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">5</text>
  <text x="550" y="345" font-family="DM Sans, sans-serif" font-size="11" fill="#1a1a2e" text-anchor="middle">ChatGPT</text>
  <text x="550" y="360" font-family="DM Sans, sans-serif" font-size="10" fill="#1a1a2e" text-anchor="middle" opacity="0.7">2022</text>
  
  <!-- Annotation -->
  <text x="550" y="385" font-family="DM Sans, sans-serif" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">500x faster than iPhone</text>
</svg>