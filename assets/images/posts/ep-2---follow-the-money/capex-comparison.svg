<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <rect width="680" height="400" fill="#faf8f5"/>
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">AI Capital Investment: The Unprecedented Scale</text>
  
  <!-- Y-axis -->
  <line x1="80" y1="70" x2="80" y2="320" stroke="#1a1a2e" stroke-width="1"/>
  <text x="40" y="195" text-anchor="middle" font-size="12" fill="#1a1a2e" transform="rotate(-90, 40, 195)">Billions USD</text>
  
  <!-- X-axis -->
  <line x1="80" y1="320" x2="620" y2="320" stroke="#1a1a2e" stroke-width="1"/>
  
  <!-- Grid lines -->
  <line x1="80" y1="120" x2="620" y2="120" stroke="#dbeafe" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="170" x2="620" y2="170" stroke="#dbeafe" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="220" x2="620" y2="220" stroke="#dbeafe" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="270" x2="620" y2="270" stroke="#dbeafe" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Y-axis labels -->
  <text x="70" y="125" text-anchor="end" font-size="11" fill="#1a1a2e">$250B</text>
  <text x="70" y="175" text-anchor="end" font-size="11" fill="#1a1a2e">$200B</text>
  <text x="70" y="225" text-anchor="end" font-size="11" fill="#1a1a2e">$150B</text>
  <text x="70" y="275" text-anchor="end" font-size="11" fill="#1a1a2e">$100B</text>
  <text x="70" y="325" text-anchor="end" font-size="11" fill="#1a1a2e">$50B</text>
  
  <!-- 2014 Bar - $44B -->
  <rect x="130" y="276" width="80" height="44" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
  <text x="170" y="340" text-anchor="middle" font-size="12" fill="#1a1a2e">2014</text>
  <text x="170" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">$44B</text>
  
  <!-- 2020 Bar - $100B estimate -->
  <rect x="280" y="220" width="80" height="100" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#1a1a2e">2020</text>
  <text x="320" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">~$100B</text>
  
  <!-- 2024 Bar - $212B+ -->
  <rect x="430" y="108" width="80" height="212" fill="#1e40af"/>
  <text x="470" y="340" text-anchor="middle" font-size="12" fill="#1a1a2e">2024</text>
  <text x="470" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">$212B+</text>
  
  <!-- Growth annotation -->
  <path d="M 210 254 Q 300 80 430 130" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="300" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">+382% growth</text>
  
  <!-- Key stat callout -->
  <rect x="480" y="180" width="135" height="70" fill="#dbeafe" rx="6"/>
  <text x="548" y="200" text-anchor="middle" font-size="10" fill="#1a1a2e">MAG 7 CapEx now</text>
  <text x="548" y="218" text-anchor="middle" font-size="10" fill="#1a1a2e">EXCEEDS entire</text>
  <text x="548" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Energy Sector</text>
</svg>