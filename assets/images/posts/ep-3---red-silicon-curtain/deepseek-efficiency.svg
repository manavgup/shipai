<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <rect width="680" height="400" fill="#faf8f5"/>
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">DeepSeek vs OpenAI: The Efficiency Gap</text>
  
  <!-- Cost comparison -->
  <text x="50" y="80" font-size="14" font-weight="600" fill="#1a1a2e">Training Cost</text>
  <rect x="50" y="90" width="50" height="30" fill="#1e40af" rx="3"/>
  <text x="110" y="110" font-size="12" fill="#1a1a2e">DeepSeek: $5.6M</text>
  <rect x="50" y="130" width="280" height="30" fill="#dbeafe" rx="3"/>
  <text x="340" y="150" font-size="12" fill="#1a1a2e">OpenAI O1: $100M+ (est.)</text>
  <text x="50" y="175" font-size="11" fill="#666">18x cheaper training</text>
  
  <!-- Memory reduction -->
  <text x="50" y="210" font-size="14" font-weight="600" fill="#1a1a2e">KV Cache Memory (MLA Innovation)</text>
  <rect x="50" y="220" width="280" height="25" fill="#dbeafe" rx="3"/>
  <text x="340" y="237" font-size="11" fill="#1a1a2e">Traditional: 100%</text>
  <rect x="50" y="250" width="20" height="25" fill="#1e40af" rx="3"/>
  <text x="80" y="267" font-size="11" fill="#1a1a2e">DeepSeek MLA: 7%</text>
  <text x="50" y="295" font-size="11" fill="#666">93% memory reduction</text>
  
  <!-- API pricing -->
  <text x="50" y="330" font-size="14" font-weight="600" fill="#1a1a2e">API Pricing per Million Tokens</text>
  <rect x="50" y="340" width="270" height="20" fill="#dbeafe" rx="3"/>
  <text x="330" y="354" font-size="11" fill="#1a1a2e">OpenAI</text>
  <rect x="50" y="365" width="10" height="20" fill="#1e40af" rx="3"/>
  <text x="70" y="379" font-size="11" fill="#1a1a2e">DeepSeek: 27x cheaper</text>
</svg>