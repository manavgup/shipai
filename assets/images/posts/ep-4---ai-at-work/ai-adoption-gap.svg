<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <rect width="680" height="400" fill="#faf8f5"/>
  
  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">The AI Adoption Paradox: Investment vs. Maturity</text>
  
  <!-- Left bar group - Investment -->
  <rect x="80" y="70" width="200" height="250" fill="#dbeafe" rx="8"/>
  <text x="180" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Companies Investing</text>
  
  <!-- 92% bar -->
  <rect x="110" y="120" width="140" height="180" fill="#1e40af" rx="4"/>
  <text x="180" y="220" text-anchor="middle" font-size="48" font-weight="bold" fill="white">92%</text>
  <text x="180" y="250" text-anchor="middle" font-size="12" fill="white">investing in AI</text>
  
  <!-- Right bar group - Maturity -->
  <rect x="400" y="70" width="200" height="250" fill="#dbeafe" rx="8"/>
  <text x="500" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Companies Mature</text>
  
  <!-- 1% bar -->
  <rect x="430" y="290" width="140" height="10" fill="#1e40af" rx="2"/>
  <text x="500" y="220" text-anchor="middle" font-size="48" font-weight="bold" fill="#1e40af">1%</text>
  <text x="500" y="250" text-anchor="middle" font-size="12" fill="#1a1a2e">at AI maturity</text>
  
  <!-- Arrow between -->
  <path d="M300 195 L380 195" stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/>
    </marker>
  </defs>
  
  <!-- Bottom stats -->
  <rect x="80" y="335" width="520" height="55" fill="white" stroke="#dbeafe" stroke-width="2" rx="8"/>
  
  <text x="180" y="358" text-anchor="middle" font-size="11" fill="#1a1a2e">Employee AI Usage</text>
  <text x="180" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">13% daily</text>
  
  <line x1="290" y1="345" x2="290" y2="380" stroke="#dbeafe" stroke-width="2"/>
  
  <text x="390" y="358" text-anchor="middle" font-size="11" fill="#1a1a2e">Leader Estimate</text>
  <text x="390" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#ea580c">4% daily</text>
  
  <line x1="490" y1="345" x2="490" y2="380" stroke="#dbeafe" stroke-width="2"/>
  
  <text x="540" y="358" text-anchor="middle" font-size="11" fill="#1a1a2e">Reality Gap</text>
  <text x="540" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">3x</text>
</svg>