<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <rect width="680" height="400" fill="#faf8f5"/>
  
  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">AI Reasoning Cost Collapse: 99.7% Drop in 2.5 Years</text>
  
  <!-- Y-axis labels (log scale) -->
  <text x="45" y="85" text-anchor="end" font-size="11" fill="#1a1a2e">$60</text>
  <text x="45" y="145" text-anchor="end" font-size="11" fill="#1a1a2e">$6</text>
  <text x="45" y="205" text-anchor="end" font-size="11" fill="#1a1a2e">$0.60</text>
  <text x="45" y="265" text-anchor="end" font-size="11" fill="#1a1a2e">$0.06</text>
  <text x="45" y="325" text-anchor="end" font-size="11" fill="#1a1a2e">$0.006</text>
  
  <!-- Y-axis title -->
  <text x="18" y="200" text-anchor="middle" font-size="11" fill="#1a1a2e" transform="rotate(-90, 18, 200)">Cost per Million Tokens</text>
  
  <!-- Grid lines -->
  <line x1="55" y1="80" x2="650" y2="80" stroke="#dbeafe" stroke-width="1"/>
  <line x1="55" y1="140" x2="650" y2="140" stroke="#dbeafe" stroke-width="1"/>
  <line x1="55" y1="200" x2="650" y2="200" stroke="#dbeafe" stroke-width="1"/>
  <line x1="55" y1="260" x2="650" y2="260" stroke="#dbeafe" stroke-width="1"/>
  <line x1="55" y1="320" x2="650" y2="320" stroke="#dbeafe" stroke-width="1"/>
  
  <!-- X-axis labels -->
  <text x="100" y="355" text-anchor="middle" font-size="11" fill="#1a1a2e">2022</text>
  <text x="250" y="355" text-anchor="middle" font-size="11" fill="#1a1a2e">2023</text>
  <text x="400" y="355" text-anchor="middle" font-size="11" fill="#1a1a2e">2024</text>
  <text x="550" y="355" text-anchor="middle" font-size="11" fill="#1a1a2e">2025</text>
  
  <!-- Basic reasoning line (purple) -->
  <path d="M100,80 L200,140 L350,200 L500,280 L600,320" stroke="#7c3aed" stroke-width="3" fill="none"/>
  <circle cx="100" cy="80" r="6" fill="#7c3aed"/>
  <circle cx="600" cy="320" r="6" fill="#7c3aed"/>
  
  <!-- High capability line (orange) -->
  <path d="M200,100 L350,160 L500,240 L600,300" stroke="#ea580c" stroke-width="3" fill="none"/>
  <circle cx="200" cy="100" r="6" fill="#ea580c"/>
  <circle cx="600" cy="300" r="6" fill="#ea580c"/>
  
  <!-- Data point labels -->
  <text x="100" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">GPT-3: $60</text>
  <text x="600" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">Llama 2 7B: $0.20</text>
  
  <!-- Legend -->
  <rect x="480" y="55" width="160" height="50" fill="white" stroke="#dbeafe" rx="4"/>
  <line x1="490" y1="72" x2="520" y2="72" stroke="#7c3aed" stroke-width="3"/>
  <text x="530" y="76" font-size="10" fill="#1a1a2e">Basic Reasoning (MMLU)</text>
  <line x1="490" y1="92" x2="520" y2="92" stroke="#ea580c" stroke-width="3"/>
  <text x="530" y="96" font-size="10" fill="#1a1a2e">High Capability Models</text>
  
  <!-- Annotation -->
  <rect x="55" y="365" width="595" height="25" fill="#1e40af" rx="4"/>
  <text x="352" y="382" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Cost falling 10x per year — faster than compute, cloud pricing, or labor</text>
</svg>