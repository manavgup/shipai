<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <rect width="680" height="400" fill="#faf8f5"/>
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">China vs US: The Humanoid Gap</text>
  
  <!-- Patent comparison -->
  <text x="170" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Humanoid Patents (5 Years)</text>
  <rect x="70" y="90" width="200" height="35" rx="4" fill="#1e40af"/>
  <text x="80" y="113" font-size="12" fill="#faf8f5">China: 7,700+</text>
  <rect x="70" y="130" width="40" height="35" rx="4" fill="#dbeafe" stroke="#1e40af"/>
  <text x="80" y="153" font-size="12" fill="#1a1a2e">US: 1,561</text>
  <text x="170" y="185" text-anchor="middle" font-size="11" fill="#1a1a2e" font-weight="bold">5x Gap</text>
  
  <!-- Cost comparison -->
  <text x="510" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Unit Cost Comparison</text>
  <rect x="410" y="90" width="200" height="35" rx="4" fill="#dbeafe" stroke="#1e40af"/>
  <text x="420" y="113" font-size="12" fill="#1a1a2e">US avg: $130,000</text>
  <rect x="410" y="130" width="60" height="35" rx="4" fill="#1e40af"/>
  <text x="420" y="153" font-size="12" fill="#faf8f5">China: $16K</text>
  <text x="510" y="185" text-anchor="middle" font-size="11" fill="#1a1a2e" font-weight="bold">8x cheaper</text>
  
  <!-- Robot installations bar -->
  <text x="340" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Industrial Robot Installations (2024)</text>
  <rect x="60" y="245" width="560" height="40" rx="4" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <rect x="60" y="245" width="302" height="40" rx="4" fill="#1e40af"/>
  <text x="211" y="272" text-anchor="middle" font-size="14" fill="#faf8f5" font-weight="bold">China: 54%</text>
  <text x="462" y="272" text-anchor="middle" font-size="12" fill="#1a1a2e">Rest of World: 46%</text>
  <text x="340" y="305" text-anchor="middle" font-size="11" fill="#1a1a2e">China: 450,000+ robots — more than rest of world combined</text>
  
  <!-- Public acceptance -->
  <text x="340" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Public Belief: Robots Will Have Positive Impact</text>
  <rect x="120" y="360" width="183" height="25" rx="4" fill="#1e40af"/>
  <text x="211" y="378" text-anchor="middle" font-size="11" fill="#faf8f5">China: 61%</text>
  <rect x="320" y="360" width="15" height="25" rx="4" fill="#dbeafe" stroke="#1e40af"/>
  <text x="400" y="378" font-size="11" fill="#1a1a2e">US: 5%</text>
</svg>