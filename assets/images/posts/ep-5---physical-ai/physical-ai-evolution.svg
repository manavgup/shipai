<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <rect width="680" height="400" fill="#faf8f5"/>
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Evolution of Robotics: From Industrial to Physical AI</text>
  
  <!-- Timeline line -->
  <line x1="60" y1="200" x2="620" y2="200" stroke="#1a1a2e" stroke-width="3"/>
  
  <!-- Era 1: 1960s -->
  <circle cx="100" cy="200" r="12" fill="#1e40af"/>
  <text x="100" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">1960s</text>
  <text x="100" y="258" text-anchor="middle" font-size="10" fill="#1a1a2e">Industrial</text>
  <text x="100" y="272" text-anchor="middle" font-size="10" fill="#1a1a2e">Robots</text>
  <rect x="55" y="100" width="90" height="70" rx="5" fill="#dbeafe" stroke="#1e40af"/>
  <text x="100" y="120" text-anchor="middle" font-size="9" fill="#1a1a2e">Pre-programmed</text>
  <text x="100" y="134" text-anchor="middle" font-size="9" fill="#1a1a2e">Rigid arms</text>
  <text x="100" y="148" text-anchor="middle" font-size="9" fill="#1a1a2e">No sensors</text>
  <text x="100" y="162" text-anchor="middle" font-size="9" fill="#1a1a2e">Repetitive tasks</text>
  
  <!-- Era 2: 1990s -->
  <circle cx="240" cy="200" r="12" fill="#1e40af"/>
  <text x="240" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">1990s</text>
  <text x="240" y="258" text-anchor="middle" font-size="10" fill="#1a1a2e">Early</text>
  <text x="240" y="272" text-anchor="middle" font-size="10" fill="#1a1a2e">Autonomous</text>
  <rect x="195" y="100" width="90" height="70" rx="5" fill="#dbeafe" stroke="#1e40af"/>
  <text x="240" y="120" text-anchor="middle" font-size="9" fill="#1a1a2e">Environmental</text>
  <text x="240" y="134" text-anchor="middle" font-size="9" fill="#1a1a2e">mapping</text>
  <text x="240" y="148" text-anchor="middle" font-size="9" fill="#1a1a2e">Rule-based</text>
  <text x="240" y="162" text-anchor="middle" font-size="9" fill="#1a1a2e">(e.g., Roomba)</text>
  
  <!-- Era 3: 2010s -->
  <circle cx="380" cy="200" r="12" fill="#1e40af"/>
  <text x="380" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">2010s</text>
  <text x="380" y="258" text-anchor="middle" font-size="10" fill="#1a1a2e">Embodied</text>
  <text x="380" y="272" text-anchor="middle" font-size="10" fill="#1a1a2e">AI Robots</text>
  <rect x="335" y="100" width="90" height="70" rx="5" fill="#dbeafe" stroke="#1e40af"/>
  <text x="380" y="120" text-anchor="middle" font-size="9" fill="#1a1a2e">AI perception</text>
  <text x="380" y="134" text-anchor="middle" font-size="9" fill="#1a1a2e">Sensor-actuator</text>
  <text x="380" y="148" text-anchor="middle" font-size="9" fill="#1a1a2e">integration</text>
  <text x="380" y="162" text-anchor="middle" font-size="9" fill="#1a1a2e">(Boston Dynamics)</text>
  
  <!-- Era 4: 2024+ -->
  <circle cx="520" cy="200" r="12" fill="#1e40af"/>
  <text x="520" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">2024+</text>
  <text x="520" y="258" text-anchor="middle" font-size="10" fill="#1a1a2e">Physical AI</text>
  <text x="520" y="272" text-anchor="middle" font-size="10" fill="#1a1a2e">Humanoids</text>
  <rect x="475" y="100" width="90" height="70" rx="5" fill="#1e40af" stroke="#1a1a2e"/>
  <text x="520" y="120" text-anchor="middle" font-size="9" fill="#faf8f5">VLA Models</text>
  <text x="520" y="134" text-anchor="middle" font-size="9" fill="#faf8f5">Generalizable</text>
  <text x="520" y="148" text-anchor="middle" font-size="9" fill="#faf8f5">Adaptive</text>
  <text x="520" y="162" text-anchor="middle" font-size="9" fill="#faf8f5">(Tesla, Unitree)</text>
  
  <!-- Key insight -->
  <rect x="180" y="310" width="320" height="55" rx="8" fill="#1a1a2e"/>
  <text x="340" y="335" text-anchor="middle" font-size="11" fill="#faf8f5">The unlock: Models that perceive, understand language,</text>
  <text x="340" y="352" text-anchor="middle" font-size="11" fill="#faf8f5">and take physical action in 3D space</text>
</svg>