<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <rect width="680" height="400" fill="#faf8f5"/>
  
  <!-- Timeline axis -->
  <line x1="60" y1="200" x2="620" y2="200" stroke="#1a1a2e" stroke-width="3"/>
  
  <!-- Year markers -->
  <circle cx="120" cy="200" r="12" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <circle cx="260" cy="200" r="12" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <circle cx="400" cy="200" r="12" fill="#1e40af"/>
  <circle cx="540" cy="200" r="16" fill="#1e40af" stroke="#1a1a2e" stroke-width="2"/>
  
  <!-- Years -->
  <text x="120" y="240" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="600">2023</text>
  <text x="260" y="240" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="600">2024</text>
  <text x="400" y="240" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="600">2025</text>
  <text x="540" y="240" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="600">2026+</text>
  
  <!-- Era labels -->
  <text x="120" y="150" text-anchor="middle" fill="#1a1a2e" font-size="16" font-weight="700">Chatbots</text>
  <text x="120" y="170" text-anchor="middle" fill="#1a1a2e" font-size="11">Reactive Q&amp;A</text>
  
  <text x="260" y="150" text-anchor="middle" fill="#1a1a2e" font-size="16" font-weight="700">Copilots</text>
  <text x="260" y="170" text-anchor="middle" fill="#1a1a2e" font-size="11">Human drives, AI assists</text>
  
  <text x="400" y="150" text-anchor="middle" fill="#1e40af" font-size="16" font-weight="700">Agents</text>
  <text x="400" y="170" text-anchor="middle" fill="#1a1a2e" font-size="11">AI executes workflows</text>
  
  <text x="540" y="150" text-anchor="middle" fill="#1a1a2e" font-size="16" font-weight="700">Multi-Agent</text>
  <text x="540" y="170" text-anchor="middle" fill="#1a1a2e" font-size="11">Digital organizations</text>
  
  <!-- Market data -->
  <rect x="60" y="280" width="560" height="80" rx="8" fill="#dbeafe" opacity="0.5"/>
  <text x="340" y="305" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="600">AI Agent Market Growth</text>
  <text x="180" y="335" text-anchor="middle" fill="#1e40af" font-size="24" font-weight="700">$7.5B</text>
  <text x="180" y="350" text-anchor="middle" fill="#1a1a2e" font-size="11">Today</text>
  <text x="340" y="335" text-anchor="middle" fill="#1a1a2e" font-size="18" font-weight="600">45% CAGR →</text>
  <text x="500" y="335" text-anchor="middle" fill="#1e40af" font-size="24" font-weight="700">$50B</text>
  <text x="500" y="350" text-anchor="middle" fill="#1a1a2e" font-size="11">2030</text>
  
  <!-- Title -->
  <text x="340" y="40" text-anchor="middle" fill="#1a1a2e" font-size="20" font-weight="700">The Age of Agency</text>
  <text x="340" y="65" text-anchor="middle" fill="#1a1a2e" font-size="13">From AI that thinks to AI that does</text>
</svg>