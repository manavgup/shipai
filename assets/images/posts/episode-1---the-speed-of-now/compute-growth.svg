<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <rect width="680" height="400" fill="#faf8f5"/>
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Why AI Accelerated: Compute vs. Algorithmic Progress</text>
  <text x="340" y="55" text-anchor="middle" font-size="12" fill="#1a1a2e" opacity="0.7">Effective compute growth since 2014 (Source: Epoch AI)</text>
  
  <!-- Y-axis label -->
  <text x="25" y="220" font-size="11" fill="#1a1a2e" transform="rotate(-90, 25, 220)">Improvement Factor (log scale)</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="340" x2="620" y2="340" stroke="#1a1a2e" stroke-opacity="0.1"/>
  <line x1="80" y1="280" x2="620" y2="280" stroke="#1a1a2e" stroke-opacity="0.1"/>
  <line x1="80" y1="220" x2="620" y2="220" stroke="#1a1a2e" stroke-opacity="0.1"/>
  <line x1="80" y1="160" x2="620" y2="160" stroke="#1a1a2e" stroke-opacity="0.1"/>
  <line x1="80" y1="100" x2="620" y2="100" stroke="#1a1a2e" stroke-opacity="0.1"/>
  
  <!-- Y-axis labels -->
  <text x="70" y="344" text-anchor="end" font-size="10" fill="#1a1a2e">1x</text>
  <text x="70" y="284" text-anchor="end" font-size="10" fill="#1a1a2e">100x</text>
  <text x="70" y="224" text-anchor="end" font-size="10" fill="#1a1a2e">10Kx</text>
  <text x="70" y="164" text-anchor="end" font-size="10" fill="#1a1a2e">1Mx</text>
  <text x="70" y="104" text-anchor="end" font-size="10" fill="#1a1a2e">100Mx</text>
  
  <!-- Stacked area representation -->
  <path d="M100,340 L200,320 L300,280 L400,200 L500,120 L600,80 L600,340 Z" fill="#1e40af" opacity="0.7"/>
  <path d="M100,340 L200,330 L300,310 L400,270 L500,220 L600,180 L600,340 Z" fill="#1a1a2e" opacity="0.8"/>
  
  <!-- X-axis labels -->
  <text x="100" y="360" text-anchor="middle" font-size="11" fill="#1a1a2e">2014</text>
  <text x="200" y="360" text-anchor="middle" font-size="11" fill="#1a1a2e">2016</text>
  <text x="300" y="360" text-anchor="middle" font-size="11" fill="#1a1a2e">2018</text>
  <text x="400" y="360" text-anchor="middle" font-size="11" fill="#1a1a2e">2020</text>
  <text x="500" y="360" text-anchor="middle" font-size="11" fill="#1a1a2e">2022</text>
  <text x="600" y="360" text-anchor="middle" font-size="11" fill="#1a1a2e">2024</text>
  
  <!-- Legend -->
  <rect x="420" y="70" width="16" height="16" fill="#1e40af" opacity="0.7" rx="2"/>
  <text x="442" y="82" font-size="11" fill="#1a1a2e">Compute scaling: 17M×</text>
  <rect x="420" y="92" width="16" height="16" fill="#1a1a2e" opacity="0.8" rx="2"/>
  <text x="442" y="104" font-size="11" fill="#1a1a2e">Algorithmic progress: 22K×</text>
  
  <!-- Key insight -->
  <rect x="380" y="130" width="230" height="50" fill="#dbeafe" rx="4"/>
  <text x="395" y="150" font-size="10" fill="#1a1a2e" font-weight="600">Without algorithmic progress,</text>
  <text x="395" y="165" font-size="10" fill="#1a1a2e">you'd need orders of magnitude</text>
  <text x="395" y="180" font-size="10" fill="#1a1a2e">more hardware for same results</text>
</svg>