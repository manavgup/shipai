<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans">
  <rect width="680" height="400" fill="#faf8f5"/>
  
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Three Drivers of Technology in Banking</text>
  
  <!-- Driver 1 -->
  <rect x="40" y="70" width="180" height="280" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Customer</text>
  <text x="130" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Expectations</text>
  <line x1="70" y1="135" x2="190" y2="135" stroke="#1e40af" stroke-width="1"/>
  <text x="130" y="160" text-anchor="middle" font-size="11" fill="#1a1a2e">Mobile banking</text>
  <text x="130" y="180" text-anchor="middle" font-size="11" fill="#1a1a2e">Real-time alerts</text>
  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#1a1a2e">Card controls</text>
  <text x="130" y="220" text-anchor="middle" font-size="11" fill="#1a1a2e">Touch interfaces</text>
  <text x="130" y="255" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">"From desktop</text>
  <text x="130" y="270" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">browser to mobile</text>
  <text x="130" y="285" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">touch—completely</text>
  <text x="130" y="300" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">different interfaces"</text>
  
  <!-- Driver 2 -->
  <rect x="250" y="70" width="180" height="280" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="340" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Industry</text>
  <text x="340" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Evolution</text>
  <line x1="280" y1="135" x2="400" y2="135" stroke="#1e40af" stroke-width="1"/>
  <text x="340" y="160" text-anchor="middle" font-size="11" fill="#1a1a2e">Mature tech stacks</text>
  <text x="340" y="180" text-anchor="middle" font-size="11" fill="#1a1a2e">Cloud infrastructure</text>
  <text x="340" y="200" text-anchor="middle" font-size="11" fill="#1a1a2e">AI/ML capabilities</text>
  <text x="340" y="220" text-anchor="middle" font-size="11" fill="#1a1a2e">API ecosystems</text>
  <text x="340" y="255" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">"You cannot be</text>
  <text x="340" y="270" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">left behind"</text>
  
  <!-- Driver 3 -->
  <rect x="460" y="70" width="180" height="280" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="550" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Regulatory</text>
  <text x="550" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Pressure</text>
  <line x1="490" y1="135" x2="610" y2="135" stroke="#1e40af" stroke-width="1"/>
  <text x="550" y="160" text-anchor="middle" font-size="11" fill="#1a1a2e">Risk management</text>
  <text x="550" y="180" text-anchor="middle" font-size="11" fill="#1a1a2e">Resilience requirements</text>
  <text x="550" y="200" text-anchor="middle" font-size="11" fill="#1a1a2e">High availability</text>
  <text x="550" y="220" text-anchor="middle" font-size="11" fill="#1a1a2e">Audit trails</text>
  <text x="550" y="255" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">"Heavily regulated</text>
  <text x="550" y="270" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">industry"</text>
  
  <!-- Bottom bar -->
  <rect x="40" y="365" width="600" height="25" rx="4" fill="#1e40af"/>
  <text x="340" y="382" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Result: Technology is foundational to banking capability</text>
</svg>