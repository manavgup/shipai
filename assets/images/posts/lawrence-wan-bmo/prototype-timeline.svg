<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans">
  <rect width="680" height="400" fill="#faf8f5"/>
  
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Prototype Development: Before vs. After AI</text>
  
  <!-- Before timeline -->
  <text x="50" y="90" font-size="14" font-weight="bold" fill="#1a1a2e">BEFORE AI</text>
  <rect x="50" y="105" width="580" height="60" rx="4" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
  
  <rect x="60" y="115" width="270" height="40" rx="3" fill="#1e40af"/>
  <text x="195" y="140" text-anchor="middle" font-size="12" fill="white" font-weight="bold">2 WEEKS (minimum)</text>
  
  <rect x="340" y="115" width="280" height="40" rx="3" fill="#1a1a2e"/>
  <text x="480" y="140" text-anchor="middle" font-size="12" fill="white" font-weight="bold">UP TO 2 MONTHS</text>
  
  <text x="60" y="185" font-size="11" fill="#1a1a2e">Business idea → Tech discussion → Requirements → Design → Prototype</text>
  
  <!-- After timeline -->
  <text x="50" y="230" font-size="14" font-weight="bold" fill="#1a1a2e">WITH AI ASSISTANCE</text>
  <rect x="50" y="245" width="580" height="60" rx="4" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
  
  <rect x="60" y="255" width="40" height="40" rx="3" fill="#1e40af"/>
  <text x="80" y="280" text-anchor="middle" font-size="10" fill="white" font-weight="bold">2 HRS</text>
  
  <rect x="110" y="255" width="80" height="40" rx="3" fill="#1a1a2e"/>
  <text x="150" y="280" text-anchor="middle" font-size="10" fill="white" font-weight="bold">UP TO 2 DAYS</text>
  
  <text x="60" y="325" font-size="11" fill="#1a1a2e">Rapid iteration → More ideas tested → Solid understanding before full development</text>
  
  <!-- Comparison arrow -->
  <path d="M 340 195 L 340 225" stroke="#1e40af" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e40af"/>
    </marker>
  </defs>
  
  <!-- Impact box -->
  <rect x="150" y="350" width="380" height="40" rx="6" fill="#1e40af"/>
  <text x="340" y="375" text-anchor="middle" font-size="13" fill="white" font-weight="bold">60-90x faster initial prototyping cycle</text>
</svg>