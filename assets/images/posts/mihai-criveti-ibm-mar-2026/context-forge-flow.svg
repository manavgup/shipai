<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans">
  <rect width="680" height="400" fill="#faf8f5"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Context Forge: Agentic Middleware Architecture</text>
  
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="100" height="70" fill="#dbeafe" rx="6"/>
    <text x="50" y="30" text-anchor="middle" font-size="11" fill="#1a1a2e">AI App</text>
    <text x="50" y="50" text-anchor="middle" font-size="10" fill="#1a1a2e">or Agent</text>
  </g>
  
  <path d="M140 95 L180 95" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  
  <g transform="translate(180, 50)">
    <rect x="0" y="0" width="320" height="300" fill="#1e40af" rx="10" opacity="0.1"/>
    <rect x="0" y="0" width="320" height="40" fill="#1e40af" rx="10"/>
    <text x="160" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#faf8f5">Context Forge Gateway</text>
    
    <rect x="20" y="55" width="120" height="45" fill="#dbeafe" rx="5"/>
    <text x="80" y="82" text-anchor="middle" font-size="10" fill="#1a1a2e">Auth/AuthZ</text>
    
    <rect x="20" y="110" width="120" height="45" fill="#dbeafe" rx="5"/>
    <text x="80" y="137" text-anchor="middle" font-size="10" fill="#1a1a2e">Pre-hooks</text>
    
    <rect x="20" y="165" width="120" height="45" fill="#dbeafe" rx="5"/>
    <text x="80" y="192" text-anchor="middle" font-size="10" fill="#1a1a2e">Guardrails (PIA)</text>
    
    <rect x="180" y="55" width="120" height="45" fill="#dbeafe" rx="5"/>
    <text x="240" y="82" text-anchor="middle" font-size="10" fill="#1a1a2e">Post-hooks</text>
    
    <rect x="180" y="110" width="120" height="45" fill="#dbeafe" rx="5"/>
    <text x="240" y="137" text-anchor="middle" font-size="10" fill="#1a1a2e">Output Compress</text>
    
    <rect x="180" y="165" width="120" height="45" fill="#dbeafe" rx="5"/>
    <text x="240" y="192" text-anchor="middle" font-size="10" fill="#1a1a2e">Observability</text>
    
    <rect x="20" y="225" width="280" height="55" fill="#faf8f5" rx="5" stroke="#1e40af"/>
    <text x="160" y="248" text-anchor="middle" font-size="11" fill="#1a1a2e">Protocol Translation</text>
    <text x="160" y="268" text-anchor="middle" font-size="9" fill="#1a1a2e">MCP ↔ A2A ↔ REST ↔ gRPC</text>
  </g>
  
  <path d="M500 200 L540 200" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arr)"/>
  
  <g transform="translate(540, 80)">
    <rect x="0" y="0" width="100" height="50" fill="#dbeafe" rx="5"/>
    <text x="50" y="30" text-anchor="middle" font-size="10" fill="#1a1a2e">MCP Servers</text>
  </g>
  <g transform="translate(540, 140)">
    <rect x="0" y="0" width="100" height="50" fill="#dbeafe" rx="5"/>
    <text x="50" y="30" text-anchor="middle" font-size="10" fill="#1a1a2e">A2A Agents</text>
  </g>
  <g transform="translate(540, 200)">
    <rect x="0" y="0" width="100" height="50" fill="#dbeafe" rx="5"/>
    <text x="50" y="30" text-anchor="middle" font-size="10" fill="#1a1a2e">REST APIs</text>
  </g>
  <g transform="translate(540, 260)">
    <rect x="0" y="0" width="100" height="50" fill="#dbeafe" rx="5"/>
    <text x="50" y="30" text-anchor="middle" font-size="10" fill="#1a1a2e">LLMs</text>
  </g>
  
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a1a2e"/></marker></defs>
  
  <text x="340" y="385" text-anchor="middle" font-size="10" fill="#1a1a2e" font-style="italic">Virtual servers: compose tools from multiple backends with unified auth and RBAC</text>
</svg>