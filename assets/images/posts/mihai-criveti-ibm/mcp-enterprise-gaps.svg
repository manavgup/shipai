    <rect x="0" y="60" width="260" height="35" rx="4" fill="#fecaca"/>
    <text x="130" y="82" text-anchor="middle" font-size="12" fill="#1a1a2e">Role-Based Access Control</text>
    
    <rect x="0" y="100" width="260" height="35" rx="4" fill="#fecaca"/>
