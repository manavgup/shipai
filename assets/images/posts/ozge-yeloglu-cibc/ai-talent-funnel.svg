<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans">
  <rect width="680" height="400" fill="#faf8f5"/>
  <text x="340" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">CIBC's AI Talent Strategy</text>
  
  <!-- Funnel visualization -->
  <polygon points="140,70 540,70 480,150 200,150" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="340" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">4,000 applications</text>
  <text x="340" y="125" text-anchor="middle" font-size="11" fill="#1a1a2e">(2 weeks, 1 position)</text>
  
  <polygon points="200,155 480,155 420,220 260,220" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="340" y="190" text-anchor="middle" font-size="12" fill="#1a1a2e">Filter through noise</text>
  
  <polygon points="260,225 420,225 380,280 300,280" fill="#1e40af"/>
  <text x="340" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#faf8f5">Qualified talent</text>
  
  <!-- Strategy boxes -->
  <rect x="40" y="310" width="180" height="70" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="130" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Get Them Early</text>
  <text x="130" y="355" text-anchor="middle" font-size="10" fill="#1a1a2e">University partnerships</text>
  <text x="130" y="370" text-anchor="middle" font-size="10" fill="#1a1a2e">8-month co-ops</text>
  
  <rect x="250" y="310" width="180" height="70" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="340" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Culture Retention</text>
  <text x="340" y="355" text-anchor="middle" font-size="10" fill="#1a1a2e">"People work for people"</text>
  <text x="340" y="370" text-anchor="middle" font-size="10" fill="#1a1a2e">Work should be fun</text>
  
  <rect x="460" y="310" width="180" height="70" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="550" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Internal Mobility</text>
  <text x="550" y="355" text-anchor="middle" font-size="10" fill="#1a1a2e">Delivery → Governance</text>
  <text x="550" y="370" text-anchor="middle" font-size="10" fill="#1a1a2e">New skills, same team</text>
</svg>