<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="5.5" orient="auto">
      <path d="M0,.5 L9,4 L0,7.5z" fill="#16a34a"/>
    </marker>
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity=".08"/></filter>
  </defs>
  <style>
    text{font-family:'Inter',system-ui,-apple-system,sans-serif}
    .panel{rx:14;stroke-width:1.5}
    .inner{rx:8;stroke-width:1}
    .ptitle{font-size:14px;font-weight:700;dominant-baseline:central}
    .psubtitle{font-size:11px;font-weight:400;dominant-baseline:central}
    .ilbl{font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .isub{font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:central}
    .dep{rx:4}
    .dep-lbl{font-size:10px;font-weight:500;dominant-baseline:central}
    .dep-size{font-size:10px;font-weight:600;dominant-baseline:central;text-anchor:end}
    .stats{font-size:10px;font-weight:500;dominant-baseline:central}
    .conn{stroke:#16a34a;stroke-width:1.4;fill:none;marker-end:url(#a)}
    .conn-lbl{fill:#16a34a;font-size:10px;font-weight:600;text-anchor:middle;dominant-baseline:central}
  </style>

  <!-- ==================== BEFORE (left, red) ==================== -->
  <g filter="url(#s)">
    <rect class="panel" x="16" y="16" width="348" height="408" fill="#fef2f2" stroke="#fca5a5" rx="14"/>
  </g>
  <text class="ptitle" x="36" y="46" fill="#991b1b">BEFORE</text>
  <text class="psubtitle" x="108" y="46" fill="#b91c1c">Monolithic — ~3 GB image</text>

  <!-- Inner container: WikiMind Container -->
  <rect class="inner" x="36" y="64" width="308" height="310" fill="#fee2e2" stroke="#fca5a5" rx="8"/>
  <text fill="#991b1b" font-size="11px" font-weight="600" x="190" y="84" text-anchor="middle" dominant-baseline="central" font-family="Inter,system-ui,sans-serif">WikiMind Container</text>

  <!-- FastAPI box (left) -->
  <rect x="52" y="102" width="108" height="60" rx="6" fill="#f87171" stroke="#ef4444" stroke-width="1"/>
  <text class="ilbl" x="106" y="125" fill="#fff">FastAPI</text>
  <text class="isub" x="106" y="144" fill="rgba(255,255,255,.8)">Gateway</text>

  <!-- Docling box (right) -->
  <rect x="176" y="102" width="152" height="60" rx="6" fill="#f87171" stroke="#ef4444" stroke-width="1"/>
  <text class="ilbl" x="252" y="125" fill="#fff">Docling</text>
  <text class="isub" x="252" y="144" fill="rgba(255,255,255,.8)">(in-process)</text>

  <!-- Dependency list -->
  <rect class="dep" x="52" y="178" width="276" height="28" fill="#fecaca" stroke="#fca5a5" stroke-width=".5" rx="4"/>
  <text class="dep-lbl" x="62" y="192" fill="#7f1d1d">PyTorch CPU</text>
  <text class="dep-size" x="318" y="192" fill="#991b1b">1.7 GB</text>

  <rect class="dep" x="52" y="212" width="276" height="28" fill="#fecaca" stroke="#fca5a5" stroke-width=".5" rx="4"/>
  <text class="dep-lbl" x="62" y="226" fill="#7f1d1d">Playwright + Chromium</text>
  <text class="dep-size" x="318" y="226" fill="#991b1b">500 MB</text>

  <rect class="dep" x="52" y="246" width="276" height="28" fill="#fecaca" stroke="#fca5a5" stroke-width=".5" rx="4"/>
  <text class="dep-lbl" x="62" y="260" fill="#7f1d1d">RapidOCR models</text>
  <text class="dep-size" x="318" y="260" fill="#991b1b">200 MB</text>

  <rect class="dep" x="52" y="280" width="276" height="28" fill="#fecaca" stroke="#fca5a5" stroke-width=".5" rx="4"/>
  <text class="dep-lbl" x="62" y="294" fill="#7f1d1d">ONNX Runtime + deps</text>
  <text class="dep-size" x="318" y="294" fill="#991b1b">~600 MB</text>

  <!-- Before stats -->
  <text class="stats" x="52" y="330" fill="#991b1b">Workers: 1 per 4 GB VM</text>
  <text class="stats" x="52" y="348" fill="#991b1b">Cold start: 10–15 s</text>
  <text class="stats" x="52" y="366" fill="#991b1b">CI build: 12–14 min</text>

  <!-- ==================== AFTER (right, green) ==================== -->
  <g filter="url(#s)">
    <rect class="panel" x="396" y="16" width="348" height="408" fill="#f0fdf4" stroke="#86efac" rx="14"/>
  </g>
  <text class="ptitle" x="416" y="46" fill="#166534">AFTER</text>
  <text class="psubtitle" x="474" y="46" fill="#15803d">Sidecar — 400 MB + docling-serve</text>

  <!-- WikiMind Container (small) -->
  <rect class="inner" x="416" y="64" width="308" height="110" fill="#dcfce7" stroke="#86efac" rx="8"/>
  <text fill="#166534" font-size="11px" font-weight="600" x="570" y="84" text-anchor="middle" dominant-baseline="central" font-family="Inter,system-ui,sans-serif">WikiMind Container</text>

  <rect x="440" y="100" width="260" height="54" rx="6" fill="#22c55e" stroke="#16a34a" stroke-width="1"/>
  <text class="ilbl" x="570" y="120" fill="#fff">FastAPI Gateway</text>
  <text class="isub" x="570" y="138" fill="rgba(255,255,255,.8)">~400 MB</text>

  <!-- HTTP arrow -->
  <line class="conn" x1="570" y1="174" x2="570" y2="216"/>
  <text class="conn-lbl" x="570" y="198">HTTP</text>

  <!-- docling-serve Container -->
  <rect class="inner" x="416" y="218" width="308" height="110" fill="#fef9c3" stroke="#fde047" rx="8"/>
  <text fill="#854d0e" font-size="11px" font-weight="600" x="570" y="238" text-anchor="middle" dominant-baseline="central" font-family="Inter,system-ui,sans-serif">docling-serve (pre-built by IBM)</text>

  <rect x="440" y="254" width="260" height="54" rx="6" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
  <text class="ilbl" x="570" y="274" fill="#fff">PyTorch, OCR, etc.</text>
  <text class="isub" x="570" y="292" fill="rgba(255,255,255,.8)">~4 GB — not our build problem</text>

  <!-- After stats -->
  <text class="stats" x="432" y="350" fill="#166534">Workers: 4–8 per VM</text>
  <text class="stats" x="432" y="368" fill="#166534">Cold start: 2–3 s</text>
  <text class="stats" x="432" y="386" fill="#166534">CI build: 2–3 min</text>
  <text class="stats" x="432" y="404" fill="#15803d" font-weight="600">Scales independently</text>
</svg>
