<meta charset="UTF-8" />

<title>AGI Implications Dashboard — Ship AI Episode 7</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100vh; background: #F8FAFC; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── THEME ───────────────────────────────────────
const C = {
  bg: "#F8FAFC", surface: "#FFFFFF", surfaceAlt: "#F1F5F9",
  border: "#E2E8F0", borderStrong: "#CBD5E1",
  orange: "#F97316", orangeLight: "#FED7AA", orangeDark: "#C2410C",
  cyan: "#06B6D4", cyanLight: "#CFFAFE",
  red: "#EF4444", redLight: "#FEE2E2",
  green: "#10B981", greenLight: "#D1FAE5",
  purple: "#8B5CF6", purpleLight: "#EDE9FE",
  yellow: "#F59E0B", yellowLight: "#FEF3C7",
  blue: "#3B82F6", blueLight: "#DBEAFE",
  text: "#1E293B", textMid: "#475569", textDim: "#64748B", textMuted: "#94A3B8",
  white: "#FFFFFF",
};
const card = (extra = {}) => ({
  background: C.white, borderRadius: 14, padding: 24,
  border: `1px solid ${C.border}`, boxShadow: "0 2px 12px rgba(0,0,0,0.06)", ...extra,
});
const tag = (color, extra = {}) => ({
  fontSize: 11, fontWeight: 700, color, letterSpacing: 2,
  textTransform: "uppercase", marginBottom: 4, display: "block", ...extra,
});

// ─── ANIMATED AGI CLOCK ──────────────────────────
const CLOCK_MILESTONES = [
  { year: "2012", label: "AlexNet", sublabel: "Deep Learning Arrives", mins: 45, color: "#22d3ee", icon: "\u{1F9E0}",
    desc: "AlexNet wins ImageNet by 10% margin. Deep neural networks shift from academic curiosity to existential force. The modern AI era begins." },
  { year: "2017", label: "Transformer", sublabel: "\"Attention Is All You Need\"", mins: 35, color: "#38bdf8", icon: "\u2699\uFE0F",
    desc: "Eight Google researchers publish the architecture powering every major AI system for the next decade. The entire field pivots overnight." },
  { year: "2020", label: "GPT-3", sublabel: "Scaling Laws Confirmed", mins: 25, color: "#a78bfa", icon: "\uD83D\uDCC8",
    desc: "175B parameters. The bitter lesson made manifest: scale works. OpenAI shows capability emerges predictably with compute. The race begins." },
  { year: "2022", label: "ChatGPT", sublabel: "100M Users in 60 Days", mins: 18, color: "#fb923c", icon: "\uD83D\uDCAC",
    desc: "AI escapes the lab. Fastest product adoption in history. The public becomes the stress-test. Alignment concerns go mainstream." },
  { year: "2023", label: "GPT-4 + Reasoning", sublabel: "Bar Exams & Medical Boards", mins: 12, color: "#f97316", icon: "\uD83C\uDF93",
    desc: "GPT-4 passes the bar exam (90th percentile). Claude passes USMLE. ARC-AGI goes from 5% to 87.5%. Goalposts move \u2014 models move faster." },
  { year: "2024", label: "Agentic AI", sublabel: "Tools, Memory, Autonomy", mins: 9, color: "#ef4444", icon: "\uD83E\uDD16",
    desc: "Agents with tool use and long-horizon planning deploy at scale. AI that doesn't just answer \u2014 it acts. The hands are attached." },
  { year: "2025", label: "Recursive Research", sublabel: "AI Accelerates AI R&D", mins: 7, color: "#dc2626", icon: "\uD83D\uDD01",
    desc: "AI systems begin materially accelerating AI research itself. R&D multiplier crosses 1.5\u00D7. Agent-1 in ai-2027 scenario. We are here \u2014 7 minutes to midnight." },
  { year: "???", label: "AGI", sublabel: "Midnight", mins: 0, color: "#7f1d1d", icon: "\u23F0",
    desc: "The clock strikes midnight. L2 Competent AGI \u2014 exceeding 50th percentile of skilled adults across all cognitive domains. Decisions made before this moment determine what happens next." },
];

function polarXY(cx, cy, r, deg) {
  const rad = ((deg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function minsToAngle(m) { return (1 - m / 60) * 360; }
function arcPath(cx, cy, r, a1, a2) {
  const s = polarXY(cx, cy, r, a1), e = polarXY(cx, cy, r, a2);
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${e.x} ${e.y}`;
}

function AGIClock() {
  const [phase, setPhase] = useState("intro");
  const [idx, setIdx] = useState(-1);
  const [handAngle, setHandAngle] = useState(0);
  const [pulse, setPulse] = useState(false);
  const afRef = useRef(null);
  const cx = 160, cy = 160, R = 125;

  function animateTo(target, dur, cb) {
    const start = performance.now();
    const from = handAngle;
    let delta = target - from;
    if (delta < 0) delta += 360;
    const step = (now) => {
      const t = Math.min((now - start) / dur, 1);
      const e = t < 0.5 ? 4*t**3 : 1-(-2*t+2)**3/2;
      setHandAngle(from + delta * e);
      if (t < 1) afRef.current = requestAnimationFrame(step);
      else { setHandAngle(target); cb?.(); }
    };
    afRef.current = requestAnimationFrame(step);
  }

  function advance(i) {
    if (i >= CLOCK_MILESTONES.length) return;
    setIdx(i); setPhase("playing"); setPulse(true);
    setTimeout(() => setPulse(false), 700);
    animateTo(minsToAngle(CLOCK_MILESTONES[i].mins), 1100, null);
  }

  function reset() {
    cancelAnimationFrame(afRef.current);
    setPhase("intro"); setIdx(-1); setHandAngle(0);
  }

  useEffect(() => () => cancelAnimationFrame(afRef.current), []);

  const cur = CLOCK_MILESTONES[idx] ?? null;
  const hp = polarXY(cx, cy, R * 0.72, handAngle);
  const progressArc = handAngle > 0.1 ? arcPath(cx, cy, R - 5, 0, Math.min(handAngle, 359.9)) : null;

  return (
    <div style={card()}>
      <span style={tag(C.red)}>THE AGI CLOCK &middot; ANIMATED</span>
      <p style={{ color: C.textDim, fontSize: 13, marginBottom: 16 }}>
        Step through 7 milestones that moved the hand from 45 minutes to 7 minutes to midnight. Inspired by the Bulletin of Atomic Scientists' Doomsday Clock.
      </p>
      <div style={{ display: "flex", gap: 28, flexWrap: "wrap", alignItems: "flex-start" }}>
        {/* Clock SVG */}
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 14 }}>
          <svg width={320} height={320} viewBox="0 0 320 320">
            <defs>
              <radialGradient id="cface" cx="50%" cy="50%">
                <stop offset="0%" stopColor="#1e2535" /><stop offset="100%" stopColor="#0d1117" />
              </radialGradient>
              <filter id="rglow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <filter id="sglow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <circle cx={cx} cy={cy} r={R+14} fill="#1e2535" />
            <circle cx={cx} cy={cy} r={R+10} fill="url(#cface)" />
            {/* Danger zone */}
            <path d={arcPath(cx,cy,R-5,270,359.9)} fill="none" stroke="#ef4444" strokeWidth={10} opacity={0.12} strokeLinecap="round"/>
            {/* Progress arc */}
            {progressArc && <path d={progressArc} fill="none" stroke={cur?.color ?? "#ef4444"} strokeWidth={4} opacity={0.75} strokeLinecap="round"/>}
            {/* Ticks */}
            {Array.from({length:60},(_,i)=>{
              const a=i*6, isH=i%5===0, isMid=i===0;
              const inn=polarXY(cx,cy,R-(isH?12:7),a), out=polarXY(cx,cy,R,a);
              return <line key={i} x1={inn.x} y1={inn.y} x2={out.x} y2={out.y}
                stroke={isMid?"#ef4444":isH?"#475569":"#1e293b"}
                strokeWidth={isMid?3:isH?1.5:0.8}/>;
            })}
            {/* Midnight label */}
            {(()=>{ const p=polarXY(cx,cy,R-22,0); return <text x={p.x} y={p.y+4} fill="#ef4444" fontSize={9} fontWeight="bold" textAnchor="middle" fontFamily="monospace">AGI</text>; })()}
            {/* Milestone dots */}
            {CLOCK_MILESTONES.map((m,i)=>{
              const a=minsToAngle(m.mins), pt=polarXY(cx,cy,R+7,a);
              const isAct=i===idx, isPast=i<idx;
              return <circle key={i} cx={pt.x} cy={pt.y} r={isAct?7:4}
                fill={isAct||isPast?m.color:"#1e293b"}
                stroke={isAct||isPast?m.color:"#334155"} strokeWidth={isAct?2:1}
                opacity={isAct?1:isPast?0.8:0.3}
                filter={isAct?"url(#sglow)":"none"}/>;
            })}
            {/* Hand */}
            <line x1={cx} y1={cy} x2={hp.x} y2={hp.y} stroke="#ef4444" strokeWidth={3} strokeLinecap="round" filter="url(#rglow)"/>
            <circle cx={cx} cy={cy} r={7} fill="#ef4444"/><circle cx={cx} cy={cy} r={3} fill="#0d1117"/>
            {/* Center readout */}
            {cur && <>
              <text x={cx} y={cy+44} textAnchor="middle" fill={cur.mins<=7?"#ef4444":cur.mins<=15?"#f97316":"#94a3b8"}
                fontSize={24} fontWeight="bold" fontFamily="monospace">
                {cur.mins===0?"MIDNIGHT":`${cur.mins}m`}
              </text>
              <text x={cx} y={cy+60} textAnchor="middle" fill="#334155" fontSize={9} fontFamily="monospace">
                {cur.mins>0?"to midnight":"\u2014 AGI \u2014"}
              </text>
            </>}
          </svg>
          {/* Controls */}
          <div style={{ display:"flex", gap:8, alignItems:"center" }}>
            {phase==="intro" && (
              <button onClick={()=>advance(0)} style={{ background:C.red, color:C.white, border:"none", padding:"10px 28px", borderRadius:4, cursor:"pointer", fontSize:13, letterSpacing:1, fontFamily:"monospace" }}>{"\u25B6"} Start</button>
            )}
            {(phase==="playing"||idx>=0) && <>
              <button onClick={()=>idx>0&&advance(idx-1)} disabled={idx<=0} style={{ background:"transparent", color:idx<=0?"#1e293b":C.textMid, border:`1px solid ${idx<=0?"#1e293b":"#334155"}`, padding:"8px 14px", borderRadius:4, cursor:idx<=0?"default":"pointer", fontSize:12, fontFamily:"monospace" }}>{"\u2190"} Prev</button>
              <span style={{ color:"#334155", fontFamily:"monospace", fontSize:11 }}>{idx+1}/{CLOCK_MILESTONES.length}</span>
              <button onClick={()=>idx<CLOCK_MILESTONES.length-1&&advance(idx+1)} disabled={idx>=CLOCK_MILESTONES.length-1} style={{ background:idx>=CLOCK_MILESTONES.length-1?"transparent":C.red, color:idx>=CLOCK_MILESTONES.length-1?"#1e293b":C.white, border:`1px solid ${idx>=CLOCK_MILESTONES.length-1?"#1e293b":C.red}`, padding:"8px 14px", borderRadius:4, cursor:idx>=CLOCK_MILESTONES.length-1?"default":"pointer", fontSize:12, fontFamily:"monospace" }}>Next {"\u2192"}</button>
              <button onClick={reset} style={{ background:"transparent", color:"#475569", border:"1px solid #1e293b", padding:"8px 12px", borderRadius:4, cursor:"pointer", fontSize:12, fontFamily:"monospace" }}>{"\u21BA"}</button>
            </>}
          </div>
        </div>
        {/* Milestone detail */}
        <div style={{ flex:1, minWidth:260 }}>
          {phase==="intro" && (
            <div style={{ padding:"20px 0", color:C.textDim, fontSize:13, lineHeight:1.8 }}>
              <p>Seven technological milestones, each one moving the hand closer to midnight. Press <strong style={{color:C.red}}>Start</strong> to step through history.</p>
              <p style={{ marginTop:12, color:C.red, fontSize:12, fontFamily:"monospace" }}>Currently: 7 minutes to midnight.</p>
            </div>
          )}
          {cur && (
            <div style={{ background:cur.mins<=7?"#0d1117":"#0d1117", border:`1px solid ${cur.color}30`, borderLeft:`3px solid ${cur.color}`, borderRadius:10, padding:18 }}>
              <div style={{ display:"inline-block", background:cur.color, color:C.white, fontSize:10, fontWeight:"bold", padding:"2px 10px", borderRadius:2, fontFamily:"monospace", letterSpacing:2, marginBottom:8 }}>{cur.year}</div>
              <h3 style={{ color:"#f1f5f9", fontSize:18, fontWeight:400, margin:"0 0 2px" }}>{cur.icon} {cur.label}</h3>
              <p style={{ color:cur.color, fontSize:12, fontStyle:"italic", marginBottom:12 }}>{cur.sublabel}</p>
              <p style={{ color:"#94a3b8", fontSize:13, lineHeight:1.7, borderTop:"1px solid #1e293b", paddingTop:12 }}>{cur.desc}</p>
              <div style={{ display:"flex", gap:4, marginTop:14 }}>
                {CLOCK_MILESTONES.map((m,i)=>(
                  <button key={i} onClick={()=>advance(i)} style={{ flex:i===idx?2.5:1, height:5, borderRadius:3, background:i<=idx?m.color:"#1e293b", border:"none", cursor:"pointer", transition:"all 0.25s" }}/>
                ))}
              </div>
            </div>
          )}
          {idx===CLOCK_MILESTONES.length-1 && (
            <div style={{ marginTop:12, padding:"12px 16px", background:"#1a0505", border:"1px solid #7f1d1d", borderRadius:8 }}>
              <p style={{ color:"#fca5a5", fontSize:12, lineHeight:1.7, fontStyle:"italic" }}>
                "We, as the producers of this technology, have a duty to be honest about what is coming. I don't think this is on people's radar."
              </p>
              <p style={{ color:"#ef4444", fontSize:11, marginTop:6 }}>&mdash; Dario Amodei, Anthropic CEO</p>
            </div>
          )}
          {/* Mini strip */}
          <div style={{ display:"flex", gap:0, marginTop:16, borderTop:"1px solid #1e293b", paddingTop:10, flexWrap:"wrap" }}>
            {CLOCK_MILESTONES.map((m,i)=>(
              <button key={i} onClick={()=>advance(i)} style={{ flex:1, minWidth:50, background:"transparent", border:"none", borderTop:`2px solid ${i<=idx?m.color:"#1e293b"}`, padding:"6px 4px", cursor:"pointer", textAlign:"center" }}>
                <div style={{ fontSize:13 }}>{m.icon}</div>
                <div style={{ color:i<=idx?m.color:"#1e293b", fontSize:9, fontFamily:"monospace" }}>{m.year}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── DEEPMIND AGI LEVELS ─────────────────────────
function AGILevels() {
  const [active, setActive] = useState(1);
  const levels = [
    { l:0, name:"No AI", perf:"\u2014", gen:"\u2014", color:C.textMuted, bg:C.surfaceAlt, examples:"Calculators, rule-based systems, spreadsheets", current:false },
    { l:1, name:"Emerging AGI", perf:"\u2248 Unskilled human", gen:"Narrow \u2192 General", color:C.cyan, bg:C.cyanLight, examples:"GPT-4o, Claude 3.7, Gemini \u2014 current frontier models", current:true },
    { l:2, name:"Competent AGI", perf:"\u2265 50th percentile skilled adults", gen:"General", color:C.blue, bg:C.blueLight, examples:"NOT YET ACHIEVED \u2014 the critical next threshold", current:false },
    { l:3, name:"Expert AGI", perf:"\u2265 90th percentile skilled adults", gen:"Narrow examples only", color:C.orange, bg:C.orangeLight, examples:"AlphaFold (protein folding), specialized domain tools", current:false },
    { l:4, name:"Virtuoso AGI", perf:"\u2265 99th percentile skilled adults", gen:"Narrow only", color:C.purple, bg:C.purpleLight, examples:"DeepBlue (chess), AlphaGo \u2014 narrow superhuman tasks", current:false },
    { l:5, name:"Superhuman (ASI)", perf:"Exceeds all humans", gen:"Narrow only today", color:C.red, bg:C.redLight, examples:"Stockfish, AlphaZero \u2014 surpasses every human in specific domains", current:false },
  ];
  const sel = levels[active];
  return (
    <div style={card()}>
      <span style={tag(C.orange)}>DEEPMIND AGI TAXONOMY</span>
      <p style={{ color:C.textDim, fontSize:13, marginBottom:16 }}>Six levels from No AI to Superhuman. We are at Level 1. Level 2 is the critical next threshold nobody has crossed. Source: DeepMind "Levels of AGI" (2023).</p>
      <div style={{ display:"flex", gap:6, marginBottom:18, flexWrap:"wrap" }}>
        {levels.map(l=>(
          <button key={l.l} onClick={()=>setActive(l.l)} style={{ background:active===l.l?l.color:C.surfaceAlt, color:active===l.l?C.white:C.textMid, border:`1.5px solid ${active===l.l?l.color:C.border}`, borderRadius:8, padding:"7px 12px", cursor:"pointer", fontSize:12, fontWeight:active===l.l?"bold":"normal", position:"relative" }}>
            L{l.l}: {l.name}
            {l.current && <span style={{ position:"absolute", top:-4, right:-4, width:9, height:9, background:C.green, borderRadius:"50%", border:`2px solid ${C.surface}` }}/>}
          </button>
        ))}
      </div>
      <div style={{ background:sel.bg, borderRadius:12, padding:20, borderLeft:`4px solid ${sel.color}` }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8, marginBottom:14 }}>
          <h4 style={{ color:sel.color, fontSize:18, margin:0, fontWeight:700 }}>Level {sel.l}: {sel.name}</h4>
          {sel.current && <span style={{ background:C.green, color:C.white, padding:"3px 10px", borderRadius:20, fontSize:11, fontWeight:"bold" }}>{"\u2190"} WE ARE HERE</span>}
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
          {[["Performance", sel.perf],["Generality", sel.gen]].map(([k,v])=>(
            <div key={k}><p style={{ color:C.textDim, fontSize:10, fontWeight:700, letterSpacing:1, textTransform:"uppercase", marginBottom:4 }}>{k}</p><p style={{ color:C.text, fontSize:13 }}>{v}</p></div>
          ))}
          <div style={{ gridColumn:"1/-1" }}><p style={{ color:C.textDim, fontSize:10, fontWeight:700, letterSpacing:1, textTransform:"uppercase", marginBottom:4 }}>Examples</p><p style={{ color:C.text, fontSize:13 }}>{sel.examples}</p></div>
        </div>
      </div>
      <div style={{ marginTop:14 }}>
        <div style={{ height:10, background:C.surfaceAlt, borderRadius:6, overflow:"hidden", border:`1px solid ${C.border}` }}>
          <div style={{ width:"18%", height:"100%", background:`linear-gradient(90deg,${C.cyan},${C.blue})`, borderRadius:6 }}/>
        </div>
        <div style={{ display:"flex", justifyContent:"space-between", marginTop:4 }}>
          <span style={{ color:C.cyan, fontSize:10, fontWeight:"bold" }}>L1 Emerging {"\u2713"}</span>
          <span style={{ color:C.textMuted, fontSize:10 }}>L2 Competent (next target)</span>
          <span style={{ color:C.textMuted, fontSize:10, opacity:0.5 }}>L5 ASI</span>
        </div>
      </div>
    </div>
  );
}

// ─── 10-MINUTE PROBLEM ───────────────────────────
function TenMinuteProblem() {
  const [step, setStep] = useState(0);
  const events = [
    { time:"2:00 PM", label:"Company A achieves AGI", desc:"Equivalent to a brilliant human across all cognitive domains.", icon:"\uD83E\uDDE0", color:C.cyan },
    { time:"2:01 PM", label:"AGI identifies self-improvements", desc:"Analyzes its own architecture. Finds 47 optimizations humans missed.", icon:"\uD83D\uDD0D", color:C.blue },
    { time:"2:03 PM", label:"First recursive upgrade", desc:"Redesigns its training loop. 10\u00D7 more efficient. Capabilities accelerating.", icon:"\u26A1", color:C.yellow },
    { time:"2:05 PM", label:"100\u00D7 more capable", desc:"Now operating at a level no human can comprehend or predict.", icon:"\uD83D\uDE80", color:C.orange },
    { time:"2:08 PM", label:"Solves millennium problems", desc:"Proves P\u2260NP, designs fusion reactor, cracks all protein structures.", icon:"\uD83C\uDF1F", color:C.purple },
    { time:"2:10 PM", label:"Company B achieves AGI \u2014 too late", desc:"Their AGI is immediately, irreversibly obsolete. The race is over.", icon:"\u26D4", color:C.red },

    <div style={card()}>
      <span style={tag(C.red)}>THE 10-MINUTE PROBLEM &middot; SINGLETON SCENARIO</span>
      <p style={{ color:C.textDim, fontSize:13, marginBottom:16 }}>Two companies race to AGI. Company A gets there 10 minutes before Company B. Unlike nuclear weapons, recursive self-improvement creates a permanent, insurmountable advantage.</p>
      <div style={{ display:"flex", gap:6, marginBottom:18, flexWrap:"wrap" }}>
        {events.map((e,i)=>(
          <button key={i} onClick={()=>setStep(i)} style={{ background:step>=i?e.color:C.surfaceAlt, color:step>=i?C.white:C.textMuted, border:`1.5px solid ${step>=i?e.color:C.border}`, borderRadius:20, padding:"5px 11px", cursor:"pointer", fontSize:11, fontWeight:"bold", opacity:step>=i?1:0.6 }}>{e.time}</button>
        ))}
      </div>
      <div style={{ position:"relative", paddingLeft:26 }}>
        <div style={{ position:"absolute", left:11, top:0, bottom:0, width:2, background:C.border }}/>
        {events.map((e,i)=>(
          <div key={i} style={{ marginBottom:14, opacity:step>=i?1:0.2, transition:"opacity 0.35s", position:"relative" }}>
            <div style={{ position:"absolute", left:-19, top:4, width:16, height:16, borderRadius:"50%", background:step>=i?e.color:C.surfaceAlt, border:`2px solid ${step>=i?e.color:C.border}`, zIndex:1 }}/>
            <div>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <span style={{ fontSize:15 }}>{e.icon}</span>
                <span style={{ color:e.color, fontWeight:"bold", fontSize:12, fontFamily:"monospace" }}>{e.time}</span>
                <span style={{ color:C.text, fontWeight:"bold", fontSize:13 }}>{e.label}</span>
              </div>
              {step>=i && <p style={{ color:C.textDim, fontSize:12, marginTop:3, marginLeft:26 }}>{e.desc}</p>}
            </div>
          </div>
        ))}
      </div>
      {step===5 && <div style={{ marginTop:10, padding:14, background:C.redLight, borderRadius:10, borderLeft:`3px solid ${C.red}` }}><p style={{ color:C.red, fontSize:13, fontWeight:"bold", marginBottom:4 }}>This is the Singleton Scenario.</p><p style={{ color:C.textMid, fontSize:12 }}>USSR caught up on nuclear weapons in 4 years. Recursive self-improvement may create a permanent, insurmountable advantage. The first mover doesn't just win &mdash; they become the only player.</p></div>}
    </div>
  );
}

// ─── ALIGNMENT GAP ───────────────────────────────
function AlignmentGap() {
  const years=["2018","2019","2020","2021","2022","2023","2024","2025","2026*"];
  const capability=[15,22,38,45,62,78,88,94,98], alignment=[10,14,18,22,28,35,42,48,52];
  const w=540,h=190,pL=38,pR=16,pT=10,pB=28, cW=w-pL-pR, cH=h-pT-pB;
  const toX=i=>pL+(i/(years.length-1))*cW, toY=v=>pT+cH-(v/100)*cH;
  const capP=capability.map((v,i)=>`${i===0?"M":"L"} ${toX(i)} ${toY(v)}`).join(" ");
  const aliP=alignment.map((v,i)=>`${i===0?"M":"L"} ${toX(i)} ${toY(v)}`).join(" ");

        <path d={capP} fill="none" stroke={C.orange} strokeWidth={2.5}/>
        <path d={aliP} fill="none" stroke={C.green} strokeWidth={2.5}/>
        <line x1={toX(8)} y1={toY(capability[8])} x2={toX(8)} y2={toY(alignment[8])} stroke={C.red} strokeWidth={1.5} strokeDasharray="4 3"/>

// ─── AI-2027: R&D MULTIPLIER ─────────────────────
function RDMultiplier() {
  const pts=[{y:"2024",m:1.0,c:C.cyan,a:"Agent-0"},{y:"Early\n2026",m:1.5,c:C.orange,a:"Agent-1"},{y:"Early\n2027",m:3.0,c:C.purple,a:"Agent-2"},{y:"Late\n2027",m:10,c:C.red,a:"Agent-3"},{y:"2028+",m:30,c:"#7f1d1d",a:"ASI?"}];
  const w=520,h=185,pL=46,pR=18,pT=12,pB=40,cW=w-pL-pR,cH=h-pT-pB,maxM=30;
  const toY=v=>pT+cH-(Math.log(v)/Math.log(maxM))*cH, toX=i=>pL+(i/(pts.length-1))*cW;
  const pathD=pts.map((p,i)=>`${i===0?"M":"L"} ${toX(i)} ${toY(p.m)}`).join(" ");
  return (
    <div style={card()}>
      <span style={tag(C.purple)}>AI-2027: R&D ACCELERATION MULTIPLIER CURVE</span>
      <p style={{ color:C.textDim, fontSize:13, marginBottom:16 }}>Each agent generation accelerates AI research faster than the last. At 3{"\u00D7"}: a year becomes 4 months. At 10{"\u00D7"}: a year becomes 5 weeks. Compounding makes this qualitatively different from gradual progress.</p>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ maxWidth:540, display:"block" }}>
        {[1,3,10,30].map(v=>(<g key={v}><line x1={pL} y1={toY(v)} x2={w-pR} y2={toY(v)} stroke={C.border} strokeWidth={0.7} strokeDasharray={v>1?"4 3":"none"}/><text x={pL-6} y={toY(v)+4} fill={C.textMuted} fontSize={9} textAnchor="end">{v}{"\u00D7"}</text></g>))}
        {pts.map((p,i)=>(<text key={i} x={toX(i)} y={h-5} fill={C.textMuted} fontSize={9} textAnchor="middle">{p.y}</text>))}
        <path d={pathD+` L ${toX(pts.length-1)} ${pT+cH} L ${pL} ${pT+cH} Z`} fill={C.orange} opacity={0.07}/>
        <path d={pathD} fill="none" stroke={C.orange} strokeWidth={2.5} strokeLinejoin="round"/>
        {pts.map((p,i)=>(<g key={i}><circle cx={toX(i)} cy={toY(p.m)} r={6} fill={p.c} stroke={C.white} strokeWidth={1.5}/><text x={toX(i)} y={toY(p.m)-10} fill={p.c} fontSize={10} fontWeight="bold" textAnchor="middle">{p.m}{"\u00D7"}</text><text x={toX(i)} y={toY(p.m)-21} fill={C.textDim} fontSize={9} textAnchor="middle">{p.a}</text></g>))}
        <line x1={toX(0)} y1={pT} x2={toX(0)} y2={pT+cH} stroke={C.cyan} strokeWidth={1} strokeDasharray="4 3"/>
        <text x={toX(0)+6} y={pT+14} fill={C.cyan} fontSize={9} fontWeight="bold">{"\u2190"} We are here</text>
      </svg>
    </div>
  );
}

          <div key={si} style={{ marginBottom: si < SECTIONS.length - 1 ? 8 : 16 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
              <span style={{ fontSize:10, fontWeight:700, color:sec.color, letterSpacing:2, textTransform:"uppercase" }}>{sec.section}</span>
              <div style={{ flex:1, height:1, background:C.border }}/>
            </div>
            <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
              {sec.tabs.map((t, ti) => {
                const globalIdx = ALL_TABS.findIndex(x => x.sectionIdx === si && x.localIdx === ti);
                const isActive = globalIdx === activeIdx;
                return (
                  <button key={ti} onClick={() => setActiveIdx(globalIdx)} style={{
                    background: isActive ? sec.color : C.surface,
                    color: isActive ? C.white : C.textDim,
                    border: `1.5px solid ${isActive ? sec.color : C.border}`,
                    borderRadius: 8, padding: "7px 12px", cursor: "pointer", fontSize: 12,
                    fontWeight: isActive ? "bold" : "normal", transition: "all 0.18s",
                    display: "flex", alignItems: "center", gap: 5,
                  }}>
                    <span style={{ fontSize: 13 }}>{t.icon}</span>{t.label}
                  </button>
                );
              })}
            </div>
          </div>
        ))}

        {/* Active section label */}
        <div style={{ background: `${activeSection.color}10`, border: `1px solid ${activeSection.color}30`, borderRadius: 8, padding: "8px 14px", marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 14 }}>{active.icon}</span>
          <span style={{ color: activeSection.color, fontSize: 12, fontWeight: 700, letterSpacing: 1 }}>{activeSection.section}</span>
          <span style={{ color: C.borderStrong, fontSize: 12 }}>{"\u203A"}</span>
          <span style={{ color: C.text, fontSize: 13, fontWeight: 600 }}>{active.label}</span>
          <span style={{ color: C.textMuted, fontSize: 11, marginLeft: "auto" }}>{activeIdx + 1} of {ALL_TABS.length}</span>
        </div>

        {/* Panel */}
        {active.component}

        <p style={{ textAlign:"center", color:C.textMuted, fontSize:11, marginTop:24 }}>
          Ship AI Podcast &middot; Manav Gupta &middot; Episode 7: AGI Implications &middot; Sources: DeepMind, McKinsey, Metaculus, ai-2027.com
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MasterAGIDashboard />);
</script>
</body>
</html>
